  <!-- ===================== 任务管理 v2 ===================== -->
  <div class="view hidden" id="view-tasks">
    <!-- 页头 -->
    <div class="tk-header">
      <div class="tk-header-left">
        <h2>任务管理</h2>
      </div>
    </div>

    <!-- 视图标签栏 -->
    <div class="tk-view-bar" id="tkViewBar">
      <div class="tk-view-tabs" id="tkViewTabs">
        <!-- 视图 Tab 由 JS 渲染 -->
      </div>
      <div class="tk-view-action">
        <button class="tk-view-add" id="tkViewAdd" data-tooltip="视图" aria-label="视图" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 2 9 5-9 5-9-5 9-5Z"/><path d="m3 12 9 5 9-5"/><path d="m3 17 9 5 9-5"/></svg>
        </button>
        <div class="tk-view-menu hidden" id="tkViewMenu">
          <button type="button" id="tkViewMenuNew"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>新增视图</button>
          <button type="button" id="tkViewManage"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="2" fill="var(--bg)"/><circle cx="15" cy="17" r="2" fill="var(--bg)"/></svg>管理视图</button>
        </div>
      </div>
      <div class="tk-view-overflow hidden" id="tkViewOverflow">
        <button class="tk-view-overflow-btn" id="tkViewOverflowBtn" data-tooltip="更多视图" aria-label="更多视图">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>
        </button>
        <div class="tk-overflow-menu" id="tkOverflowMenu"></div>
      </div>
    </div>

    <!-- 工具栏 -->
    <div class="tk-toolbar">
      <div class="tk-tools-left">
        <div class="tk-search-wrap">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
          <input type="search" id="tkSearch" placeholder="搜索任务或编号…" autocomplete="off">
        </div>
        <button class="tk-filter-btn" id="tkFilterBtn" aria-haspopup="menu" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
          <span id="tkFilterLabel">筛选</span>
        </button>
      </div>
      <div class="tk-tools-right">
        <button type="button" class="tk-toolbar-new hidden" id="tkToolbarNew" aria-label="新建任务">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>新建</span>
        </button>
        <button class="tk-display-btn" id="tkDisplayBtn" aria-haspopup="dialog" aria-expanded="false">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="21" y1="6" x2="6" y2="6"/><line x1="21" y1="12" x2="6" y2="12"/><line x1="21" y1="18" x2="6" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
          <span>显示</span>
        </button>
        <div class="tk-display-popover hidden" id="tkDisplayPopover">
          <div class="tk-display-layout-row">
            <span id="tkLayoutLabel">视图类型</span>
            <div class="tk-layout-toggle" id="tkLayoutToggle" role="group" aria-labelledby="tkLayoutLabel">
              <button type="button" class="tk-layout-btn active" data-layout="board" aria-label="看板视图" aria-pressed="true">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="6" height="18" rx="1"/><rect x="10" y="3" width="6" height="12" rx="1"/><rect x="17" y="3" width="4" height="8" rx="1"/></svg>
                <span>看板</span>
              </button>
              <button type="button" class="tk-layout-btn" data-layout="list" aria-label="列表视图" aria-pressed="false">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg>
                <span>列表</span>
              </button>
            </div>
          </div>
          <div class="tk-display-group-row">
            <label for="tkGroupSelect">分组</label>
            <select id="tkGroupSelect" aria-label="分组">
              <option value="status">状态</option>
              <option value="priority">优先级</option>
              <option value="assignee">负责人</option>
              <option value="project">项目</option>
              <option value="none">不分组</option>
            </select>
          </div>
          <div class="tk-display-group-row tk-display-view-mode-row">
            <label for="tkViewModeSelect">查看模式</label>
            <select id="tkViewModeSelect" aria-label="查看模式">
              <option value="slide">侧滑详情</option>
              <option value="full">全屏详情</option>
              <option value="split">左列表右详情</option>
            </select>
          </div>
          <div class="tk-display-section">
            <label for="tkSortSelect">排序</label>
            <div class="tk-display-sort-row">
              <select id="tkSortSelect" aria-label="排序">
                <option value="status">状态</option>
                <option value="priority">优先级</option>
                <option value="dueDate">截止日期</option>
                <option value="createDate">创建时间</option>
                <option value="code">编号</option>
                <option value="title">标题</option>
                <option value="module">模块</option>
                <option value="assignee">处理人</option>
                <option value="project">项目</option>
              </select>
              <button type="button" id="tkSortDirection" aria-label="排序方向">最新优先</button>
            </div>
          </div>
          <label class="tk-display-switch-row">
            <span>显示子任务</span>
            <input type="checkbox" id="tkShowSubtasks" checked>
            <span class="tk-display-switch" aria-hidden="true"></span>
          </label>
          <div class="tk-display-section">
            <span class="tk-display-section-label">卡片属性</span>
            <div class="tk-display-properties" id="tkCardProperties"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- 筛选菜单与子菜单 -->
    <div class="tk-filter-panel hidden" id="tkFilterPanel" role="menu" aria-label="筛选">
      <div class="tk-filter-panel-body" id="tkFilterPanelBody"></div>
      <div class="tk-filter-submenu hidden" id="tkFilterSubmenu"></div>
    </div>

    <!-- 筛选标签栏 -->
    <div class="tk-filter-chips hidden" id="tkFilterChips"></div>

    <!-- 批量操作条 -->
    <div class="tk-bulk-bar hidden" id="tkBulkBar">
      <div class="tk-bulk-info">
        <span class="tk-bulk-count" id="tkBulkCount">0</span> 项已选
        <button class="tk-bulk-clear" id="tkBulkClear">取消选择</button>
      </div>
      <div class="tk-bulk-actions">
        <button class="tk-bulk-btn" data-bulk="status">改状态</button>
        <button class="tk-bulk-btn" data-bulk="assignee">改处理人</button>
        <button class="tk-bulk-btn tk-bulk-danger" data-bulk="delete">删除</button>
      </div>
    </div>

    <!-- 视图主体 -->
    <div class="tk-body" id="tkBody">
      <!-- 看板视图 -->
      <div class="tk-board" id="tkBoard">
        <div class="tk-board-scroll" id="tkBoardScroll">
          <!-- 看板列由 JS 渲染 -->
        </div>
      </div>
      <!-- 列表视图 -->
      <div class="tk-list hidden" id="tkList">
        <div class="tk-list-scroll" id="tkListScroll">
          <table class="tk-table">
            <thead>
              <tr id="tkListHead">
                <th class="tk-col-check"><input type="checkbox" id="tkCheckAll"></th>
                <th class="tk-col-code" data-sort="code">编号</th>
                <th class="tk-col-title" data-sort="title">标题</th>
                <th class="tk-col-module" data-sort="module">模块</th>
                <th class="tk-col-status" data-sort="status">状态</th>
                <th class="tk-col-priority" data-sort="priority">优先级</th>
                <th class="tk-col-assignee" data-sort="assignee">处理人</th>
                <th class="tk-col-project" data-sort="project">项目</th>
                <th class="tk-col-due" data-sort="dueDate">截止</th>
                <th class="tk-col-created" data-sort="createDate">创建</th>
                <th class="tk-col-actions"></th>
              </tr>
            </thead>
            <tbody id="tkListBody"></tbody>
          </table>
        </div>
      </div>
      <!-- 空状态 -->
      <div class="tk-empty hidden" id="tkEmpty">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="opacity:.3"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="1"/></svg>
        <p>没有匹配的任务</p>
        <button class="tk-btn-ghost" id="tkResetFilter">清除筛选</button>
      </div>

      <!-- 侧滑详情的透明点击层 -->
      <div class="tk-drawer-clickaway hidden" id="tkDrawerClickaway" aria-hidden="true"></div>

      <!-- 任务详情面板 -->
      <div class="tk-drawer hidden" id="tkDrawer">
      <div class="tk-drawer-resize" id="tkDrawerResize" role="separator" aria-orientation="vertical" aria-label="调整详情面板宽度" tabindex="0"></div>
      <div class="tk-drawer-head">
        <div class="tk-drawer-head-title">
          <h3 class="tk-drawer-title" id="tkDrawerTitle" contenteditable="true" data-field="title"></h3>
          <span class="tk-drawer-code" id="tkDrawerCode"></span>
        </div>
        <div class="tk-drawer-head-actions">
          <button class="tk-drawer-head-btn" id="tkDrawerChat" aria-label="发起会话">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span>发起会话</span>
          </button>
          <button class="tk-drawer-head-btn" id="tkDrawerMore" data-tooltip="更多" aria-label="更多" aria-haspopup="menu" aria-expanded="false">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>
          </button>
          <button class="tk-drawer-head-btn" id="tkDrawerSidebarToggle" data-tooltip="侧边栏" aria-label="侧边栏">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
          </button>
          <button class="tk-drawer-close" id="tkDrawerClose" data-tooltip="关闭详情" aria-label="关闭详情">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
      <div class="tk-drawer-body" id="tkDrawerBody">
        <!-- 详情内容由 JS 渲染 -->
      </div>
      <div class="tk-drawer-foot"></div>
      </div>
      <div class="tk-split-empty hidden" id="tkSplitEmpty">从左侧选择任务查看详情</div>
    </div>

    <!-- 新建/编辑任务弹窗 -->
    <div class="tk-modal-overlay hidden" id="tkModalOverlay">
      <div class="tk-modal" id="tkModal">
        <div class="tk-modal-head">
          <h3 id="tkModalTitle">新建任务</h3>
          <button class="tk-modal-close" id="tkModalClose" data-tooltip="关闭" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="tk-modal-body">
          <div class="tk-form-row">
            <label>标题 <span class="tk-req">*</span></label>
            <input type="text" id="tkFormTitle" placeholder="输入任务标题">
          </div>
          <div class="tk-form-row">
            <label>描述</label>
            <textarea id="tkFormDesc" rows="3" placeholder="输入任务描述"></textarea>
          </div>
          <div class="tk-form-grid">
            <div class="tk-form-field">
              <label>状态</label>
              <select id="tkFormStatus"></select>
            </div>
            <div class="tk-form-field">
              <label>优先级</label>
              <select id="tkFormPriority"></select>
            </div>
            <div class="tk-form-field">
              <label>处理人</label>
              <select id="tkFormAssignee"></select>
            </div>
            <div class="tk-form-field">
              <label>项目</label>
              <select id="tkFormProject"></select>
            </div>
            <div class="tk-form-field">
              <label>截止日期</label>
              <input type="date" id="tkFormDue">
            </div>
            <div class="tk-form-field">
              <label>标签</label>
              <input type="text" id="tkFormLabels" placeholder="逗号分隔">
            </div>
          </div>
        </div>
        <div class="tk-modal-foot">
          <button class="tk-btn-ghost" id="tkModalCancel">取消</button>
          <button class="tk-btn-primary" id="tkModalSave">保存</button>
        </div>
      </div>
    </div>

    <!-- 保存视图对话框 -->
    <div class="tk-modal-overlay hidden" id="tkSaveViewOverlay">
      <div class="tk-modal tk-modal-sm">
        <div class="tk-modal-head">
          <h3>保存为视图</h3>
          <button class="tk-modal-close" id="tkSaveViewClose" data-tooltip="关闭" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="tk-modal-body">
          <p class="tk-save-view-hint">基于工作区全部任务创建</p>
          <div class="tk-form-row">
            <label for="tkSaveViewName">名称 <span class="tk-req">*</span></label>
            <input type="text" id="tkSaveViewName" placeholder="例如：需要 Review" maxlength="80">
          </div>
          <div class="tk-form-row">
            <label for="tkSaveViewVisibility">可见性</label>
            <select id="tkSaveViewVisibility"><option value="private">仅自己可见</option><option value="workspace">工作区成员可见</option></select>
          </div>
          <div class="tk-form-row">
            <label for="tkSaveViewScope">任务范围</label>
            <select id="tkSaveViewScope"><option value="all">全部任务</option><option value="my_assigned">我负责</option><option value="my_created">我创建</option><option value="members">分配给成员</option><option value="agents">分配给智能体</option></select>
          </div>
          <div class="tk-form-row">
            <label for="tkSaveViewLayout">布局</label>
            <select id="tkSaveViewLayout"><option value="board">看板</option><option value="list">列表</option></select>
          </div>
          <p class="tk-save-view-summary" id="tkSaveViewSummary"></p>
        </div>
        <div class="tk-modal-foot">
          <button class="tk-btn-ghost" id="tkSaveViewCancel">取消</button>
          <button class="tk-btn-primary" id="tkSaveViewConfirm">创建视图</button>
        </div>
      </div>
    </div>

    <!-- 管理视图对话框 -->
    <div class="tk-modal-overlay hidden" id="tkManageViewsOverlay">
      <div class="tk-modal tk-modal-sm">
        <div class="tk-modal-head">
          <h3>管理视图</h3>
          <button class="tk-modal-close" id="tkManageViewsClose" data-tooltip="关闭" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="tk-modal-body">
          <div class="tk-manage-list" id="tkManageList"></div>
        </div>
        <div class="tk-modal-foot">
          <button class="tk-btn-ghost" id="tkManageViewsCancel">关闭</button>
        </div>
      </div>
    </div>

    <!-- 批量操作下拉 -->
    <div class="tk-popover" id="tkBulkStatusMenu">
      <div class="tk-popover-item" data-status="backlog">待处理</div>
      <div class="tk-popover-item" data-status="in_progress">进行中</div>
      <div class="tk-popover-item" data-status="in_review">评审中</div>
      <div class="tk-popover-item" data-status="done">已完成</div>
      <div class="tk-popover-item" data-status="blocked">已阻塞</div>
    </div>
    <div class="tk-popover" id="tkBulkAssigneeMenu"></div>
  </div>
