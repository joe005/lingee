  <!-- ===================== 协作开发 ===================== -->
  <div class="view hidden" id="view-collab">
    <div class="cv-wsbar">
      <div class="cv-proj cv-ws" id="cvWsSwitch">
        <button type="button" class="cv-proj-btn" id="cvWsBtn" aria-haspopup="true" aria-expanded="false">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
          <span id="cvWsLabel">全部工作区</span>
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
        <div class="cv-proj-menu" id="cvWsMenu"></div>
      </div>
    </div>
    <div class="tab-nav" id="cvTabNav">
      <button class="tab-nav-item tab-nav-item--active" data-cvview="tasks" onclick="cvSwitchView('tasks')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>任务管理</button>
      <button class="tab-nav-item" data-cvview="members" onclick="cvSwitchView('members')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>项目</button>
      <button class="tab-nav-item" data-cvview="experts" onclick="cvSwitchView('experts')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87l1.18 6.88L12 17.77l-6.18 3.25L7 14.14l-5-4.87 6.91-1.01L12 2z"/></svg>专家</button>
      <button class="tab-nav-item" data-cvview="teams" onclick="cvSwitchView('teams')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>专家团</button>
      <button class="tab-nav-item" data-cvview="config" data-perm="owner" onclick="cvSwitchView('config')"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>设置</button>
    </div>
    <div class="cv-subnav hidden" id="cvSubNav"></div>

    <div class="cv-panel active" id="cv-tasks-current"></div>
    <!--#include "src/views/collab/tasks-legacy.html" -->

    <!--#include "src/views/collab/projects.html" -->

    <!-- 专家管理 -->
    <div class="cv-panel" id="cv-experts">
      <div class="scroll">
        <div class="cv-head">
          <div>
            <div class="scroll-title">专家库<span class="cv-global-chip">全局</span></div>
            <div class="scroll-desc">专家库为全局资产，所有项目共用，可直接对话，也可创建自己的专家</div>
          </div>
          <div class="cv-head-right">
            <div class="search-wrap"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input type="search" id="cvExpertSearch" placeholder="搜索专家、职业或能力" autocomplete="off" readonly></div>
            <button class="sync-btn" id="cvNewExpertBtn" data-perm="dev"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>创建专家</button>
          </div>
        </div>
        <div id="cvExpertSections"></div>
      </div>
    </div>

    <!-- 专家团管理 -->
    <div class="cv-panel" id="cv-teams">
      <div class="scroll cv-scroll-soft">
        <div class="cv-head">
          <div>
            <div class="scroll-title">专家团<span class="cv-global-chip">全局</span></div>
            <div class="scroll-desc">统一维护专家团定义；项目在项目详情中选择要使用的专家团</div>
          </div>
          <div class="cv-head-right">
            <div class="apps-search">
              <input type="search" id="expertSearchInput" placeholder="搜索专家团" autocomplete="off" readonly>
              <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            </div>
            <button class="btn-new" id="newExpertEntryBtn" data-perm="dev"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span id="newExpertEntryLabel">新建专家团</span></button>
          </div>
        </div>
        <div class="apps-grid" id="expertGrid"></div>
      </div>
    </div>

    <!--#include "src/views/collab/settings.html" -->

    <!-- 评审详情 -->
    <div class="cv-panel" id="cv-review-detail">
      <div class="rv-detail">
        <div class="rv-detail-left">
          <div class="rv-header">
            <div class="rv-header-left">
              <button class="rv-back" onclick="cvSwitchView('review')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回</button>
              <span class="rv-title" id="cv-rv-title">评审详情</span>
            </div>
          </div>
          <div class="rv-art-tabs" id="cv-rv-art-tabs"></div>
          <div class="rv-art-body" id="cv-rv-art-body"></div>
        </div>
        <div class="rv-detail-right">
          <div class="rv-panel-header" id="cv-rv-panel-header"></div>
          <div class="rv-comments" id="cv-rv-comments"></div>
          <div class="rv-input-area">
            <textarea class="rv-input" id="cv-rv-input" placeholder="输入评审意见"></textarea>
            <div class="rv-actions">
              <button class="rv-btn rv-btn--pass" onclick="cvSubmitReview('pass')">通过</button>
              <button class="rv-btn rv-btn--reject" onclick="cvSubmitReview('reject')">驳回</button>
              <button class="rv-btn rv-btn--comment" onclick="cvSubmitReview('comment')">评论</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- 任务对话 -->
    <div class="cv-panel" id="cv-chat">
      <div class="chat-view">
        <div class="chat-header">
          <div class="chat-header-left">
            <button class="rv-back" onclick="tbBackConvList()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>返回会话列表</button>
            <span class="chat-title" id="cv-chat-task-title">任务执行中</span>
            <span class="chat-status-badge chat-status-badge--running" id="cv-chat-status-badge"></span>
          </div>
        </div>
        <div class="chat-body" id="cv-chat-body"></div>
        <div class="chat-input-bar">
          <input class="chat-input" id="cv-chat-input" placeholder="输入消息" onkeydown="if(event.key==='Enter')cvSendChatMessage()">
          <button class="chat-send" onclick="cvSendChatMessage()">发送</button>
        </div>
      </div>
    </div>
  </div>
