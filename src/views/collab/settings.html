<!-- 设置 · 工作区设置 -->
<div class="cv-panel" id="cv-config">
  <div class="scroll">
    <div id="cv-config-header">
      <div class="scroll-title">系统设置</div>
      <div class="scroll-desc">维护协作权限与系统集成</div>
    </div>
    <div class="config-layout">
      <aside class="config-nav">
        <button type="button" class="config-nav-item on" data-config-nav="perm">人员</button>
        <button type="button" class="config-nav-item" data-config-nav="integration">系统集成</button>
      </aside>
      <div class="config-main">
        <div class="config-pane" data-config-pane="perm">
          <div class="cv-head">
            <div>
              <div class="cv-sec-title">人员</div>
              <div class="cv-sec-desc">关联灵基用户并设置协作角色；项目成员在项目详情中添加</div>
            </div>
            <div class="cv-head-right">
              <button class="sync-btn" data-perm="owner" onclick="cvOpenPersonNew()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>添加人员</button>
            </div>
          </div>
          <div class="cv-perm-scope"><strong>协作角色</strong><span>所有灵基用户均可参与协作；这里只维护人员关联与管理员、项目经理权限。</span></div>
          <div id="cv-perm-table"></div>
        </div>
        <div class="config-pane hidden" data-config-pane="integration">
          <div class="cv-head">
            <div><div class="cv-sec-title">系统集成</div><div class="cv-sec-desc">配置 DevOps、禅道的任务来源与第三方应用凭据</div></div>
          </div>
          <div class="cv-integration-note">当前是单文件原型：应用密钥仅用于演示录入，不会保存到浏览器；真实鉴权与任务同步需要服务端接入。这里不会向第三方发送请求，请勿填写真实密钥。</div>
          <div class="cv-integration-providers">
            <button type="button" class="cv-integration-provider" data-cv-integration-provider="devops"><span class="cv-integration-mark">D</span><span><b>DevOps</b><small>用户故事、缺陷与任务</small></span><span class="cv-integration-action">配置来源 →</span></button>
            <button type="button" class="cv-integration-provider" data-cv-integration-provider="zentao"><span class="cv-integration-mark">禅</span><span><b>禅道</b><small>需求、Bug 与执行任务</small></span><span class="cv-integration-action">配置来源 →</span></button>
          </div>
          <form id="cv-integration-form" class="cv-integration-form hidden">
            <div class="cv-integration-form-head"><strong id="cv-integration-form-title">配置任务来源</strong><button type="button" id="cv-integration-cancel">取消</button></div>
            <input id="cv-integration-id" type="hidden">
            <input id="cv-integration-type" type="hidden">
            <label>系统地址<input id="cv-integration-url" type="url" placeholder="https://devops.example.com" required></label>
            <label>外部项目标识<input id="cv-integration-project" type="text" placeholder="项目编码或项目 ID" required></label>
            <label>第三方应用 ID<input id="cv-integration-app-id" type="text" placeholder="第三方系统提供的应用 ID" autocomplete="off" required></label>
            <label>第三方应用密钥<input id="cv-integration-secret" type="password" placeholder="每次保存时重新输入" autocomplete="new-password" required></label>
            <div class="cv-integration-fields">接入后同步外部编号、标题、描述、类型、状态、负责人，并按系统与外部编号去重。</div>
            <button type="submit" class="sync-btn">保存配置</button>
          </form>
          <div class="cv-integration-list-head">已保存的任务来源</div>
          <div id="cv-integration-list"></div>
        </div>
      </div>
    </div>
  </div>
</div>
