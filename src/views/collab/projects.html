<!-- 项目管理：项目列表 + 项目详情（引用交付团队） -->
<div class="cv-panel" id="cv-members">
  <div class="scroll">
    <div class="cv-head" id="cv-project-head">
      <div>
        <div class="scroll-title">项目<span class="cv-title-count" id="cv-proj-count">0</span></div>
        <div class="scroll-desc">维护项目基本信息，引用交付团队与专家团</div>
      </div>
      <div class="cv-head-right">
        <button class="sync-btn" onclick="cvOpenProjNew()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>新建项目</button>
      </div>
    </div>
    <div class="pj-list-toolbar" id="cv-project-toolbar">
      <div class="search-wrap pj-project-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="cvProjectSearch" name="project-search" type="search" autocomplete="new-password" data-1p-ignore data-lpignore="true" placeholder="搜索项目" /></div>
      <div class="pj-filter-selects" aria-label="项目过滤条件">
        <select id="cvProjectStatusFilter" aria-label="按状态筛选项目"><option value="">全部状态</option><option value="planned">规划中</option><option value="in_progress">进行中</option><option value="paused">已暂停</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select>
        <select id="cvProjectSquadFilter" aria-label="按交付团队筛选项目"><option value="">全部团队</option></select>
        <select id="cvProjectOwnerFilter" aria-label="按负责人筛选项目"><option value="">全部负责人</option></select>
      </div>
      <div class="pj-view-switch" id="cv-project-view-switch" role="group" aria-label="项目显示形式"></div>
    </div>
    <div id="cv-proj-list"></div>
    <div id="cv-proj-detail" class="hidden"></div>
  </div>
</div>
