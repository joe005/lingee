<!-- 项目：项目列表 + 项目详情 -->
<div class="cv-panel" id="cv-members">
  <div class="scroll pj-list-mode">
    <div class="list-page-header" id="cv-project-head">
      <div class="list-page-heading"><h2>项目<span class="list-page-count" id="cv-proj-count">0</span></h2></div>
    </div>
    <div class="list-page-view-bar" id="cv-project-view-bar"><div class="list-page-tabs" id="cv-project-tabs" role="tablist" aria-label="项目视图"></div></div>
    <div class="pj-list-toolbar" id="cv-project-toolbar">
      <div class="tk-tools-left"><div class="tk-search-wrap pj-project-search"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="cvProjectSearch" name="project-search" type="search" autocomplete="new-password" data-1p-ignore data-lpignore="true" placeholder="搜索项目…" aria-label="搜索项目" /></div>
      <button type="button" class="tk-filter-btn" id="cvProjectFilterBtn" aria-controls="cvProjectFilterPanel" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg><span id="cvProjectFilterLabel">筛选</span></button></div>
      <div class="tk-tools-right"><button type="button" class="tk-toolbar-new" data-perm="project-create" onclick="cvOpenProjNew()" aria-label="新建项目"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg><span>新建项目</span></button><div class="pj-view-action"><button type="button" class="tk-display-btn" id="cvProjectDisplayBtn" aria-controls="cvProjectDisplayPanel" aria-expanded="false" aria-label="显示设置" title="显示设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16M12 9h6M12 14h6"/></svg></button><div class="pj-display-panel hidden" id="cvProjectDisplayPanel"><span>视图类型</span><div class="pj-view-switch" id="cv-project-view-switch" role="group" aria-label="项目显示形式"></div></div></div></div>
      <div class="pj-filter-panel hidden" id="cvProjectFilterPanel" aria-label="按项目字段筛选"><div id="cvProjectFilterFields"></div><div class="pj-filter-submenu hidden" id="cvProjectFilterOptions"></div></div>
    </div>
    <div class="pj-filter-chips hidden" id="cvProjectFilterChips" aria-label="当前筛选"></div>
    <div id="cv-proj-list"></div>
    <div id="cv-proj-detail" class="hidden"></div>
  </div>
</div>
