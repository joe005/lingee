      <button type="button" class="tk-filter-btn" id="cvProjectFilterBtn" aria-controls="cvProjectFilterPanel" aria-expanded="false"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg><span id="cvProjectFilterLabel">筛选</span></button></div>
