<!-- 智能体团队管理 -->
<div class="cv-panel" id="cv-teams">
  <div class="scroll cv-scroll-soft">
    <div class="cv-head expert-assets-toolbar">
      <div class="asset-primary-tabs" data-asset-primary="team" aria-label="智能体团队目录"><button type="button" class="list-page-tab active" data-asset-mode="mine" aria-pressed="true">我的智能体团队 <span data-asset-total></span></button><button type="button" class="list-page-tab" data-asset-mode="more" aria-pressed="false">更多智能体团队</button></div>

      <div class="cv-head-right">
        <div class="apps-search asset-search">
          <input type="search" id="expertSearchInput" placeholder="搜索智能体团队" aria-label="搜索智能体团队" autocomplete="off" readonly>
          <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        </div>
        <button type="button" class="lingee-create asset-create-btn" data-asset-create="team" aria-label="新增智能体团队"><svg class="create-plus" width="10" height="10" viewBox="0 0 11 11" fill="none" aria-hidden="true"><path d="M5.25 0C5.66421 0 6 0.335786 6 0.75V4.5H9.75C10.1642 4.5 10.5 4.83579 10.5 5.25C10.5 5.66421 10.1642 6 9.75 6H6V9.75C6 10.1642 5.66421 10.5 5.25 10.5C4.83579 10.5 4.5 10.1642 4.5 9.75V6H0.75C0.335786 6 0 5.66421 0 5.25C0 4.83579 0.335786 4.5 0.75 4.5H4.5V0.75C4.5 0.335786 4.83579 0 5.25 0Z" fill="currentColor"/></svg>新建</button>
      </div>
    </div>
    <div class="asset-secondary-row">
      <div class="expert-layer-tabs asset-source-filters" data-layer-tabs="team" aria-label="来源筛选"><button type="button" class="list-page-tab active" data-layer="all" aria-pressed="true">全部 <span data-layer-count="all"></span></button><button type="button" class="list-page-tab" data-layer="builtin" aria-pressed="false">金蝶官方 <span data-layer-count="builtin"></span></button><button type="button" class="list-page-tab" data-layer="shared" aria-pressed="false">企业自建 <span data-layer-count="shared"></span></button><button type="button" class="list-page-tab" data-layer="personal" aria-pressed="false">个人开发 <span data-layer-count="personal"></span></button></div>
    </div>
    <div class="apps-grid" id="expertGrid"></div>
  </div>
</div>
