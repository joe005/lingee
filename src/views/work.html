<!-- ===================== 工作 ===================== -->
<!-- 工作板块：新任务首屏（问候、场景页签、输入框、分组与快捷入口），菜单与历史对话在侧栏 #workNav。 -->
<div class="view hidden" id="view-work">
  <div class="work-stage">
    <h1 class="work-hero">灵基一动，工作轻松</h1>
    <div class="work-modes" role="tablist" aria-label="工作场景" id="workModes"></div>
    <div class="work-box">
      <div class="work-composer">
        <textarea id="workInput" rows="2" aria-label="输入任务"></textarea>
        <div class="work-composer-bar">
          <button type="button" class="work-icon-btn" data-work-tool="添加附件" aria-label="添加附件" data-tooltip="添加附件"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
          <button type="button" class="work-icon-btn" data-work-tool="选择对象" aria-label="@ 选择对象" data-tooltip="@ 选择对象"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M16 12v1.5a2.5 2.5 0 0 0 5 0V12a9 9 0 1 0-3.5 7.1"/></svg></button>
          <div class="work-dd">
            <button type="button" class="work-dd-btn" data-work-dd="agent" aria-haspopup="listbox" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="8" width="16" height="12" rx="3"/><path d="M12 8V4"/><circle cx="12" cy="3.5" r="1"/><path d="M9 14h.01M15 14h.01"/></svg><span data-work-dd-label>选择智能体</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <div class="work-dd-menu" role="listbox" hidden></div>
          </div>
          <span class="work-spacer"></span>
          <div class="work-dd">
            <button type="button" class="work-dd-btn" data-work-dd="model" aria-haspopup="listbox" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg><span data-work-dd-label>自动</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
            <div class="work-dd-menu work-dd-menu--right" role="listbox" hidden></div>
          </div>
          <button type="button" class="work-icon-btn" data-work-tool="语音输入" aria-label="语音输入" data-tooltip="语音输入"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
          <button type="button" class="work-send" id="workSend" aria-label="发送" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></button>
        </div>
      </div>
      <div class="work-group-row">
        <div class="work-dd">
          <button type="button" class="work-dd-btn work-dd-btn--ghost" data-work-dd="group" aria-haspopup="listbox" aria-expanded="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg><span data-work-dd-label>选择分组</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="work-dd-menu work-dd-menu--up" role="listbox" hidden></div>
        </div>
      </div>
    </div>
    <div class="work-chips" id="workChips" aria-label="快捷入口"></div>
  </div>
</div>
