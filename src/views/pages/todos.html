<div class="view hidden" id="view-todos" data-route="todos">
  <div class="todo-page-content">
    <h1 tabindex="-1">待办</h1>
    <div class="todo-page-toolbar">
      <div class="todo-page-tabs" role="tablist" aria-label="办理状态">
        <button type="button" role="tab" data-todo-status="pending" aria-selected="true" class="active">待处理 <span>0</span></button>
        <button type="button" role="tab" data-todo-status="done" aria-selected="false">已处理 <span>0</span></button>
      </div>
      <div class="todo-page-filters">
        <select id="todoBusinessFilter" aria-label="业务维度"><option value="">全部业务维度</option><option value="work">日常工作</option><option value="collab">协作开发</option><option value="space">空间邀请</option></select>
        <div class="todo-page-date-wrap">
          <button type="button" id="todoDateButton" aria-expanded="false" aria-controls="todoDatePanel"><span id="todoDateLabel">开始日期 ～ 结束日期</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M7 3v4M17 3v4M3 11h18"/></svg></button>
          <div class="todo-page-date-panel" id="todoDatePanel" hidden><label>开始日期<input type="date" id="todoStartDate"></label><label>结束日期<input type="date" id="todoEndDate"></label><button type="button" id="todoDateClear">清空</button></div>
        </div>
      </div>
    </div>
    <div class="todo-page-list" id="todoList" aria-live="polite" hidden></div>
    <div class="todo-page-empty" role="status"><svg width="48" height="48" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="5" width="36" height="38" rx="7"/><path d="M7 26h9l4 6h8l4-6h9M18 18h12"/></svg><p id="todoEmptyText">暂无待处理事项</p></div>
  </div>
</div>
