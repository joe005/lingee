<!-- 编辑已有的我的专家 -->
<div class="modal-overlay" id="expertEditModal">
  <form class="modal-card env-config-modal team-config-modal" id="expertEditForm" role="dialog" aria-modal="true" aria-labelledby="expertEditTitle" novalidate>
    <div class="modal-header">
      <div class="env-config-heading">
        <div class="team-panel-title-row">
          <div class="modal-title" id="expertEditTitle">编辑智能体</div>
          <span class="team-panel-badge" id="expertEditBadge">已保存</span>
        </div>
        <div class="team-panel-sub" id="expertEditSub"></div>
      </div>
      <div class="modal-header-actions">
        <button type="submit" class="modal-btn cancel team-panel-btn-save" id="xeSaveBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span class="btn-label">保存</span></button>
        <button type="button" class="modal-btn cancel team-panel-btn-test" id="xeCallBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2L5.2 18a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M7.5 15h9"/></svg><span class="btn-label">测试</span></button>
        <button type="submit" class="modal-btn confirm team-panel-btn-submit" id="xeSubmitReviewBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span class="btn-label">提交审核</span></button>
      </div>
      <button class="modal-close" id="expertEditClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="team-panel-tabs-row">
      <div class="modal-tabs" id="xeTabs" role="tablist" aria-label="智能体配置">
        <button type="button" class="modal-tab active" role="tab" aria-selected="true" data-xtab="base">智能体</button>
        <button type="button" class="modal-tab" role="tab" aria-selected="false" data-xtab="skills">技能</button>
        <button type="button" class="modal-tab" role="tab" aria-selected="false" data-xtab="kn">知识</button>
        <button type="button" class="modal-tab" role="tab" aria-selected="false" data-xtab="more">触发词与工作方式</button>
      </div>
      <button type="button" class="team-panel-reset" id="xeResetBtn" aria-label="还原为已保存内容" title="还原为已保存内容"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </div>
    <div class="modal-body env-config-body">
      <div class="team-pane" data-xpane="base">
        <section class="env-form-section">
          <div class="env-form-grid">
            <label class="env-field"><span>名称<span class="env-required">*</span></span>
              <input type="text" id="xeName" placeholder="例如：苍穹工作流开发" autocomplete="off"></label>
            <label class="env-field env-field-wide"><span>简介</span>
              <textarea id="xeDesc" rows="2" placeholder="他深耕什么领域、擅长什么、能帮你解决什么"></textarea></label>
            <label class="env-field env-field-wide"><span>标签</span>
              <input type="text" id="xeTags" placeholder="用逗号分隔，例如：流程建模, 苍穹工作流, 流程设计" autocomplete="off"></label>
          </div>
          <div class="env-form-section-title x-sec-sub">头像</div>
          <div class="x-av-picker" id="xeAvatars"></div>
        </section>
        <section class="env-form-section">
          <div class="env-form-section-title">可承担的工作<span class="env-required">*</span>
            <span class="team-hint-inline">决定他在智能体团队里能领哪些任务</span></div>
          <div class="x-mode-picker" id="xeModes"></div>
        </section>
        <section class="env-form-section">
          <div class="env-form-section-title">模型级别
            <span class="team-hint-inline">决定这个智能体运行时用哪个推理档位</span></div>
          <div class="x-mode-picker" id="xeTiers"></div>
        </section>
      </div>

      <div class="team-pane hidden" data-xpane="skills">
        <section class="env-form-section xe-skills-section">
          <div class="env-form-section-title">技能配置</div>
          <div class="xe-skills-toolbar"><button type="button" class="modal-btn cancel" id="xeAddSkill">添加</button><input type="search" id="xeSkillSearch" placeholder="搜索技能名称或用途" autocomplete="off"><span id="xeSkillCount">已选 0 项</span></div>
          <div id="xeSkillList" class="xe-skill-options"></div>
        </section>
      </div>

      <div class="team-pane hidden" data-xpane="more">
        <section class="env-form-section">
          <div class="env-form-section-title">常见触发词
            <span class="team-hint-inline">用户平时会怎么找他做事。需要用户提供的内容写成 [方括号]，发送时没填会在会话里追问</span></div>
          <div class="x-cmd-rows" id="xeCmds"></div>
          <button type="button" class="team-add" id="xeAddCmd">＋ 添加一条</button>
        </section>
        <section class="env-form-section">
          <div class="env-form-grid">
            <label class="env-field env-field-wide"><span>能力项</span>
              <input type="text" id="xeComp" placeholder="用逗号分隔，例如：cosmic.workflow · advanced" autocomplete="off"></label>
          </div>
        </section>
      </div>

      <div class="team-pane hidden" data-xpane="kn">
        <div class="xk-bar">
          <button type="button" class="xk-btn" id="xkAddBtn">＋ 添加</button>
          <button type="button" class="xk-btn" id="xkUpBtn">⬆ 上传</button>
          <input type="file" id="xkFile" multiple hidden>
          <div class="xk-bar-sp"></div>
          <input type="search" class="xk-search" id="xkSearch" placeholder="搜索知识目录、文件名或创建者" autocomplete="off">
        </div>
        <div class="xk-hint">勾了能力项会自动带出对应目录（标着服务哪项能力）；也可以手动追加，或直接上传文件。文档本身留在企业知识库里，这里只记录挂了哪些目录。</div>
        <div class="xk-cols">
          <div class="xk-side" id="xkSide"></div>
          <div class="xk-docs" id="xkDocs"></div>
        </div>
      </div>
    </div>
    <div class="modal-footer team-modal-footer hidden"><button type="button" id="xeCancelBtn">取消</button></div>
  </form>
</div>

<div class="modal-overlay" id="xeSkillPicker">
  <section class="modal-card env-config-modal" role="dialog" aria-modal="true" aria-labelledby="xeSkillPickerTitle">
    <div class="modal-header"><div class="modal-title" id="xeSkillPickerTitle">添加技能</div><input type="search" id="xeSkillPickerSearch" placeholder="搜索技能" aria-label="搜索可用技能"><button type="button" class="modal-close" id="xeSkillPickerClose" aria-label="关闭">×</button></div>
    <div class="modal-body" id="xeSkillPickerList"></div>
    <div class="modal-footer"><span id="xeSkillPickerCount"></span><div class="team-footer-spacer"></div><button type="button" class="modal-btn cancel" id="xeSkillPickerCancel">取消</button><button type="button" class="modal-btn confirm" id="xeSkillPickerConfirm">确定</button></div>
  </section>
</div>
