<!-- ===================== 协作开发 · 弹窗 ===================== -->
<div class="cv-scope" id="cvModals">
<!-- ============ MODAL: SYNC TASK ============ -->
<div class="sync-overlay" id="cv-sync-overlay" style="display:none" onclick="if(event.target===this)cvCloseSyncModal()">
  <div class="sync-modal">
    <div class="sync-modal__header">
      <h3 class="sync-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 2v6h-6"/><path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M3 22v-6h6"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/></svg>同步任务</h3>
      <button class="sync-modal__close" onclick="cvCloseSyncModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__form">
      <div class="sync-modal__field"><label class="sync-modal__label">任务标题</label><input class="sync-modal__input" id="cv-sync-title" placeholder="请输入任务标题"></div>
      <div class="sync-modal__field"><label class="sync-modal__label">任务描述</label><textarea class="sync-modal__textarea" id="cv-sync-desc" rows="3" placeholder="请输入任务描述"></textarea></div>
      <div class="sync-modal__row">
        <div class="sync-modal__field"><label class="sync-modal__label">任务类型</label><div class="sync-modal__select" onclick="cvToggleSyncDropdown(this,event)"><span class="sync-modal__select-placeholder" id="cv-sync-type-val">需求</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div>
        <div class="sync-modal__field"><label class="sync-modal__label">优先级</label><div class="sync-modal__select" onclick="cvToggleSyncDropdown(this,event)"><span class="sync-modal__select-placeholder" id="cv-sync-priority-val">中</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div>
      </div>
      <div class="sync-modal__row">
        <div class="sync-modal__field"><label class="sync-modal__label">来源</label><div class="sync-modal__select" onclick="cvToggleSyncDropdown(this,event)"><span class="sync-modal__select-placeholder" id="cv-sync-source-val">对话自建</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div>
        <div class="sync-modal__field"><label class="sync-modal__label">任务大小</label><div class="sync-modal__select" onclick="cvToggleSyncDropdown(this,event)"><span class="sync-modal__select-placeholder" id="cv-sync-size-val">小任务</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></div></div>
      </div>
      <div class="sync-modal__field"><label class="sync-modal__label">协作模式</label>
        <div class="sync-collab-options" id="cv-sync-collab-options">
          <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,#7c5cfc,#5b8def)">H</div><span class="sync-collab-name">人人协作</span></div>
          <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,#34c07a,var(--success))">AI</div><span class="sync-collab-name">人Agent协作</span></div>
          <div class="sync-collab-option sync-collab-option--selected" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,var(--dot-blue),#5b8def)">A</div><span class="sync-collab-name">Agent间协作</span></div>
          <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:var(--border-hover);color:var(--text-secondary)">—</div><span class="sync-collab-name">无需协作</span></div>
        </div>
      </div>
    </div>
    <div class="sync-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseSyncModal()">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvSaveSyncTask()">仅保存</button>
      <button class="sync-modal__btn sync-modal__btn--start" onclick="cvStartSyncTask()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>启动任务</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: EXEC ============ -->
<div class="sync-overlay" id="cv-exec-overlay" style="display:none" onclick="if(event.target===this)cvCloseTaskModal('cv-exec-overlay')">
  <div class="task-modal">
    <div class="task-modal__header">
      <h3 class="task-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--success)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>执行任务</h3>
      <button class="task-modal__close" onclick="cvCloseTaskModal('cv-exec-overlay')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="task-modal__body">
      <div class="task-modal__label">选择协作模式</div>
      <div class="sync-collab-options" id="cv-exec-collab-options">
        <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,#7c5cfc,#5b8def)">H</div><span class="sync-collab-name">人人协作</span></div>
        <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,#34c07a,var(--success))">AI</div><span class="sync-collab-name">人Agent协作</span></div>
        <div class="sync-collab-option sync-collab-option--selected" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:linear-gradient(135deg,var(--dot-blue),#5b8def)">A</div><span class="sync-collab-name">Agent间协作</span></div>
        <div class="sync-collab-option" onclick="cvSelectCollabMode(this)"><div class="sync-collab-icon" style="background:var(--border-hover);color:var(--text-secondary)">—</div><span class="sync-collab-name">无需协作</span></div>
      </div>
    </div>
    <div class="task-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseTaskModal('cv-exec-overlay')">取消</button>
      <button class="sync-modal__btn sync-modal__btn--start" onclick="cvConfirmExec()"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>启动执行</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: TRANSFER ============ -->
<div class="sync-overlay" id="cv-transfer-overlay" style="display:none" onclick="if(event.target===this)cvCloseTaskModal('cv-transfer-overlay')">
  <div class="task-modal">
    <div class="task-modal__header">
      <h3 class="task-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--dot-blue)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 1l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 23l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>转交任务</h3>
      <button class="task-modal__close" onclick="cvCloseTaskModal('cv-transfer-overlay')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="task-modal__body">
      <div class="task-modal__label">选择转交人员</div>
      <div class="person-list" id="cv-transfer-person-list"></div>
    </div>
    <div class="task-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseTaskModal('cv-transfer-overlay')">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmTransfer()">确认转交</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: TWIST ============ -->
<div class="sync-overlay" id="cv-twist-overlay" style="display:none" onclick="if(event.target===this)cvCloseTaskModal('cv-twist-overlay')">
  <div class="task-modal">
    <div class="task-modal__header">
      <h3 class="task-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#7858f9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.5 0 4.8 1 6.5 2.7"/><polyline points="21 3 21 9 15 9"/></svg>流转任务</h3>
      <button class="task-modal__close" onclick="cvCloseTaskModal('cv-twist-overlay')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="task-modal__body">
      <div class="task-modal__label">研发流程 · 当前执行节点高亮</div>

      <div class="task-modal__label" style="margin-top:16px">传递产物</div>
      <div class="artifact-list" id="cv-twist-artifacts"></div>

    <div class="task-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseTaskModal('cv-twist-overlay')">取消</button>
      <button class="sync-modal__btn sync-modal__btn--purple" onclick="cvConfirmTwist()">流转到下一步</button>
    </div>
  </div>
</div>

<!-- ============ MODAL: REVIEW ============ -->
<div class="sync-overlay" id="cv-review-overlay" style="display:none" onclick="if(event.target===this)cvCloseTaskModal('cv-review-overlay')">
  <div class="task-modal">
    <div class="task-modal__header">
      <h3 class="task-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--warning)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>发起评审</h3>
      <button class="task-modal__close" onclick="cvCloseTaskModal('cv-review-overlay')"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>

    </div>
  </div>
</div>

<div class="sync-overlay" id="cv-addmember-overlay" style="display:none" onclick="if(event.target===this)cvCloseAddMemberModal()">

    <div class="sync-modal__header">
      <h3 class="sync-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>添加协作人员</h3>
      <button class="sync-modal__close" onclick="cvCloseAddMemberModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="sync-modal__field">
        <label class="sync-modal__label">选择工作区人员</label>
        <div class="search-wrap" style="margin-bottom:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b5b5ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="cv-tp-search" type="search" autocomplete="off" data-1p-ignore data-lpignore="true" placeholder="搜索姓名、邮箱..." onkeyup="cvSearchThirdPartyMembers(this.value)" /></div>
      </div>
      <div class="sync-modal__field">
        <div id="cv-tp-list" style="max-height:360px;overflow-y:auto"></div>

    </div>

  </div>
</div>

<div class="sync-overlay" id="cv-newsquad-overlay" style="display:none" onclick="if(event.target===this)cvCloseNewSquadModal()">

<!-- 项目 · 创建与编辑弹窗 -->
<div class="sync-overlay" id="cv-projedit-overlay" style="display:none" onclick="if(event.target===this)cvCloseProjEdit()">
  <div class="sync-modal pe-modal" role="dialog" aria-modal="true" aria-labelledby="cv-pe-title">
    <div class="sync-modal__header pe-header">
      <div class="pe-breadcrumb"><span id="cv-pe-workspace">工作区</span><span aria-hidden="true">›</span><span id="cv-pe-title">新建项目</span></div>
      <button type="button" class="sync-modal__close" aria-label="关闭" onclick="cvCloseProjEdit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body pe-body">
      <div class="pe-body-main">
        <label class="pe-title-label" for="cv-pe-name">项目名称 <span class="pe-required-mark" aria-hidden="true">*</span></label>
        <input id="cv-pe-name" class="pe-title-input" placeholder="项目标题" autocomplete="off" required />
        <label class="pe-sr-only" for="cv-pe-desc">项目描述</label>
        <textarea id="cv-pe-desc" class="pe-desc-input" placeholder="添加描述…"></textarea>
      </div>
    </div>
    <div class="pe-property-bar" aria-label="项目属性">
      <label class="pe-pill pe-pill--status"><span class="pe-pill-mark" aria-hidden="true">●</span><select id="cv-pe-status" aria-label="项目状态"><option value="planned">规划中</option><option value="in_progress">进行中</option><option value="paused">已暂停</option><option value="completed">已完成</option><option value="cancelled">已取消</option></select></label>
      <label class="pe-pill"><span aria-hidden="true">—</span><select id="cv-pe-priority" aria-label="优先级"><option>高</option><option>中</option><option>低</option></select></label>
      <label class="pe-pill"><select id="cv-pe-owner" aria-label="项目负责人"></select></label>
      <label class="pe-pill pe-pill--required"><span class="pe-required-mark" aria-hidden="true">*</span><select id="cv-pe-squad" aria-label="交付团队（必填）" required></select></label>
      <label class="pe-pill pe-pill--required"><span class="pe-required-mark" aria-hidden="true">*</span><select id="cv-pe-team" aria-label="专家团（必填）" required></select></label>
      <label class="pe-pill pe-pill--repo"><svg class="pe-repo-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-3.162 19.488c.5.093.683-.217.683-.483 0-.237-.009-.866-.014-1.7-2.78.604-3.369-1.34-3.369-1.34-.455-1.157-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.071 1.53 1.03 1.53 1.03.892 1.529 2.34 1.088 2.91.832.09-.646.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.944 0-1.092.39-1.985 1.03-2.685-.104-.253-.447-1.27.098-2.647 0 0 .84-.269 2.75 1.026A9.57 9.57 0 0 1 12 6.818c.85.004 1.705.115 2.504.337 1.91-1.295 2.748-1.026 2.748-1.026.547 1.377.204 2.394.1 2.647.64.7 1.028 1.593 1.028 2.685 0 3.844-2.339 4.688-4.566 4.936.359.31.678.92.678 1.855 0 1.34-.012 2.421-.012 2.751 0 .268.18.58.688.481A10.002 10.002 0 0 0 12 2Z"/></svg><input id="cv-pe-repo" type="url" aria-label="Git 仓库地址" placeholder="代码仓库 URL"></label>
      <details class="pe-more" id="cv-pe-more"><summary aria-label="更多项目属性" title="更多项目属性">···</summary>
        <div class="pe-more-panel">
          <label for="cv-pe-start">开始时间<input id="cv-pe-start" type="date"></label>
          <label for="cv-pe-end">结束时间<input id="cv-pe-end" type="date"></label>
        </div>
      </details>
    </div>
    <div class="sync-modal__footer pe-footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseProjEdit()">取消</button>
      <button id="cv-pe-submit" class="sync-modal__btn sync-modal__btn--primary" onclick="cvSaveProjEdit()">创建项目</button>
    </div>
  </div>
</div>
</div>
