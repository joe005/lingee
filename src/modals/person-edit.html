<div class="sync-overlay" id="cv-personedit-overlay" style="display:none" onclick="if(event.target===this)cvClosePersonEdit()">
  <div class="sync-modal" style="width:420px">
    <div class="sync-modal__header">
      <h3 class="sync-modal__title" id="cv-pedit-title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>新增人员</h3>
      <button class="sync-modal__close" onclick="cvClosePersonEdit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="sync-modal__field">
        <label class="sync-modal__label">姓名</label>
        <input id="cv-ps-name" placeholder="如：张工" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none" />
      </div>
      <div class="sync-modal__field">
        <label class="sync-modal__label">邮箱</label>
        <input id="cv-ps-email" placeholder="如 zhang***@kingdee.com" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none" />
      </div>
      <div class="sync-modal__field" style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <label class="sync-modal__label">部门</label>
          <input id="cv-ps-dept" placeholder="如：研发部" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none" />
        </div>
        <div>
          <label class="sync-modal__label">角色</label>
          <select id="cv-ps-role" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none;background:#fff"><option>开发</option><option>架构</option><option>测试</option><option>运维</option><option>需求</option><option>产品</option></select>
        </div>
      </div>
    </div>
    <div class="sync-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvClosePersonEdit()">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvSavePersonEdit()">保存</button>
    </div>
  </div>
</div>
