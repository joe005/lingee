<div class="sync-overlay" id="cv-featureedit-overlay" style="display:none" onclick="if(event.target===this)cvCloseFeatureEdit()">
  <div class="ms-modal">
    <div class="ms-head">
      <div class="ms-head-t">编辑父任务</div>
      <div class="ms-head-s">修改父任务的标题、描述、附件与验收标准（父任务不可直接执行）</div>
      <button class="sync-modal__close" onclick="cvCloseFeatureEdit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="ms-body">
      <div class="ms-field">
        <label>标题</label>
        <input id="cv-fe-title" placeholder="父任务标题">
      </div>
      <div class="ms-field">
        <label>描述</label>
        <textarea id="cv-fe-desc" rows="3" placeholder="描述"></textarea>
      </div>
      <div class="ms-field">
        <label>附件</label>
        <div class="ms-files">
          <button type="button" class="ms-file-add" onclick="cvFeatureEditAddFile()">＋ 附件</button>
          <span class="ms-file-list" id="cv-fe-files"></span>
        </div>
      </div>
      <div class="ms-field">
        <label>验收标准</label>
        <textarea id="cv-fe-accept" rows="3" placeholder="验收标准，每行一条"></textarea>
      </div>
    </div>
    <div class="ms-foot">
      <span class="ms-foot-hint"></span>
      <div class="ms-foot-right">
        <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseFeatureEdit()">取消</button>
        <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvSaveFeatureEdit()">保存</button>
      </div>
    </div>
  </div>
</div>
