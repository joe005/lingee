<div class="sync-overlay" id="cv-addtoproj-overlay" style="display:none" onclick="if(event.target===this)cvCloseAddToProject()">
  <div class="sync-modal" style="width:520px">
    <div class="sync-modal__header">
      <h3 class="sync-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>添加协作人员</h3>
      <button class="sync-modal__close" onclick="cvCloseAddToProject()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="sync-modal__field">
        <label class="sync-modal__label">从人员库选择</label>
        <div class="search-wrap" style="margin-bottom:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b5b5ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="cv-atp-search" type="search" autocomplete="off" data-1p-ignore data-lpignore="true" placeholder="搜索姓名、邮箱、部门..." onkeyup="cvSearchProjectPersons(this.value)" /></div>
      </div>
      <div class="sync-modal__field">
        <div id="cv-atp-list" style="max-height:360px;overflow-y:auto"></div>
      </div>
    </div>
    <div class="sync-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseAddToProject()">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmAddToProject()">添加选中</button>
    </div>
  </div>
</div>
