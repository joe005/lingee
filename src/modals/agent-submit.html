<!-- 智能体开发：卡片「⋯」菜单与提交上架审核确认（对齐 Lingee Build 智能体开发页） -->
<div class="agent-card-menu" id="agentCardMenu" role="menu" hidden>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-agent-action="edit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>编辑</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-agent-action="local-test"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4a2 2 0 0 0 1.8-3l-5-9V3"/></svg>本地测试</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-agent-action="cloud-test"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19a4.5 4.5 0 1 0-1.4-8.8A6 6 0 1 0 6 17.3"/><path d="m9 15 2 2 4-4"/></svg>云端测试</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-agent-action="submit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M5 20h14"/></svg>提交</button>
  <button type="button" class="agent-card-menu-item is-danger" role="menuitem" data-agent-action="delete"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>删除</button>
</div>
<div class="agent-submit-overlay" id="agentSubmitOverlay" hidden>
  <div class="agent-submit-card" role="alertdialog" aria-modal="true" aria-labelledby="agentSubmitTitle" aria-describedby="agentSubmitDesc">
    <div class="agent-submit-head">
      <span class="agent-submit-icon" aria-hidden="true">!</span>
      <div class="agent-submit-title" id="agentSubmitTitle">提交上架审核</div>
    </div>
    <p class="agent-submit-desc" id="agentSubmitDesc">当前为生产环境的智能体上架操作，提交后将转交后台管理员审核，审核通过后正式生效。确认提交？</p>
    <div class="agent-submit-foot">
      <button type="button" class="agent-submit-cancel" id="agentSubmitCancel">取消</button>
      <button type="button" class="agent-submit-ok" id="agentSubmitOk">确认提交</button>
    </div>
  </div>
</div>
