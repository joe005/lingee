<!-- 智能体团队配置 -->
<div class="modal-overlay" id="teamModal">
  <form class="modal-card env-config-modal team-config-modal" id="teamConfigForm" role="dialog" aria-modal="true" aria-labelledby="teamModalTitle" novalidate>
    <div class="modal-header">
      <div class="env-config-heading">
        <div class="team-panel-title-row">
          <div class="modal-title" id="teamModalTitle">智能体团队详情</div>
          <span class="team-panel-badge" id="teamModalBadge">已保存</span>
        </div>
      </div>
      <div class="modal-header-actions">
        <button type="submit" class="modal-btn cancel team-panel-btn-save" id="teamSaveBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg><span class="btn-label">保存</span></button>
        <button type="button" class="modal-btn cancel team-panel-btn-test" id="teamCallBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6.2L5.2 18a2 2 0 0 0 1.7 3h10.2a2 2 0 0 0 1.7-3L14 9.2V3"/><path d="M7.5 15h9"/></svg><span class="btn-label">测试</span></button>
        <button type="submit" class="modal-btn confirm team-panel-btn-submit" id="teamSubmitReviewBtn"><svg class="btn-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v4h16v-4"/></svg><span class="btn-label">提交审核</span></button>
      </div>
      <button class="modal-close" id="teamModalClose" type="button" aria-label="关闭">×</button>
    </div>
    <div class="team-panel-tabs-row">
      <div class="modal-tabs team-modal-tabs" role="tablist" aria-label="智能体团队配置">
        <button type="button" class="modal-tab team-modal-tab active" role="tab" aria-selected="true" data-team-tab="info">基本信息</button>
        <button type="button" class="modal-tab team-modal-tab" role="tab" aria-selected="false" data-team-tab="stages">开发流程</button>
        <button type="button" class="modal-tab team-modal-tab" role="tab" aria-selected="false" data-team-tab="commands">触发词</button>
      </div>
      <button type="button" class="team-panel-reset" id="teamResetBtn" hidden aria-label="还原为已保存内容" title="还原为已保存内容"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v5h-5"/></svg></button>
    </div>
    <div class="modal-body env-config-body">
      <div class="team-pane" data-team-pane="info" role="tabpanel">
        <div id="teamEditFields">
          <div class="team-hint">智能体团队定义成员和使用方式；执行任务时由 Runtime 动态生成 WorkItem 并路由给合适的专家。</div>
          <section class="env-form-section">
            <div class="env-form-grid">
              <label class="env-field env-field-wide"><span>名称<span class="env-required">*</span></span>
                <input type="text" id="teamName" placeholder="给这个智能体团队起个名字" autocomplete="off" required></label>
              <label class="env-field env-field-wide"><span>说明</span>
                <textarea id="teamDesc" rows="3" placeholder="它擅长什么、适合什么场景"></textarea></label>
            </div>
          </section>
        </div>
        <section class="env-form-section">
          <div class="env-form-section-title">成员 <span class="team-count" id="teamCount">0</span></div>
          <div class="team-members" id="teamMembers"></div>
          <button type="button" class="team-add" id="teamAddBtn">＋ 添加</button>
        </section>
      </div>
      <div class="team-pane hidden" data-team-pane="stages" role="tabpanel">
        <div class="team-stages" id="teamStages" aria-label="开发流程"></div>
      </div>
      <div class="team-pane hidden" data-team-pane="commands" role="tabpanel">
        <section class="env-form-section">
          <div class="env-form-section-title">常见触发词</div>
          <div class="x-cmd-rows" id="teamCmds"></div>
          <button type="button" class="team-add" id="teamAddCmd">＋ 添加一条</button>
        </section>
      </div>
    </div>
    <div class="modal-footer team-modal-footer hidden" id="teamViewFoot">
      <button type="button" class="btn-link team-delete-btn" id="teamDeleteBtn">删除该智能体团队</button>
      <div class="team-footer-spacer"></div>
      <button type="button" class="modal-btn cancel" id="teamCancelBtn">取消</button>
      <button type="button" class="modal-btn cancel" id="teamEditBtn">编辑</button>
      <button type="button" class="modal-btn confirm" id="teamViewSubmitBtn">提交审核</button>
    </div>
  </form>
</div>
