<div class="sync-overlay" id="cv-splittask-overlay" style="display:none" onclick="if(event.target===this)cvCloseProjectSplit()">
  <div class="split-modal">
    <div class="split-head">
      <div class="split-head-l">
        <span class="split-agent-av">✦</span>
        <div><div class="split-head-t">智能拆解</div><div class="split-head-s" id="cv-split-agent">产品经理 · 用户故事拆分</div></div>
      </div>
      <button class="sync-modal__close" onclick="cvCloseProjectSplit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="split-body" id="cv-split-body"></div>
    <div class="split-foot">
      <div class="split-count">已确认 <b id="cv-split-count">0</b> 项</div>
      <div class="split-foot-right">
        <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseProjectSplit()">取消</button>
        <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmProjectSplit()">确认生成任务</button>
      </div>
    </div>
  </div>
</div>
