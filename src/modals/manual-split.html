<div class="sync-overlay" id="cv-manualsplit-overlay" style="display:none" onclick="if(event.target===this)cvCloseManualSplit()">
  <div class="ms-modal">
    <div class="ms-head">
      <div class="ms-head-t">手动新增父任务</div>
      <div class="ms-head-s">父任务只用于规划目标与验收标准，不能直接执行；创建后可继续下推成子任务</div>
      <button class="sync-modal__close" onclick="cvCloseManualSplit()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="ms-body">
      <div class="ms-field">
        <label>标题</label>
        <input id="cv-ms-title" placeholder="父任务标题，如：客户管理">
      </div>
      <div class="ms-field">
        <label>描述</label>
        <textarea id="cv-ms-desc" rows="3" placeholder="描述"></textarea>
      </div>
      <div class="ms-field">
        <label>附件</label>
        <div class="ms-files">
          <button type="button" class="ms-file-add" onclick="cvMsAddFile()">＋ 附件</button>
          <span class="ms-file-list" id="cv-ms-files"></span>
        </div>
      </div>
      <div class="ms-field">
        <label>验收标准</label>
        <textarea id="cv-ms-accept" rows="3" placeholder="验收标准，每行一条"></textarea>
      </div>
    </div>
    <div class="ms-foot">
      <span class="ms-foot-hint">生成后进入任务规划，可继续下推成子任务</span>
      <div class="ms-foot-right">
        <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseManualSplit()">取消</button>
        <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmManualSplit()">创建父任务</button>
      </div>
    </div>
  </div>
</div>
