    <!-- 新建/编辑任务弹窗 -->
    <div class="tk-modal-overlay hidden" id="tkModalOverlay">
      <div class="tk-modal" id="tkModal">
        <div class="tk-modal-head">
          <h3 id="tkModalTitle">新建任务</h3>
          <button class="tk-modal-close" id="tkModalClose" data-tooltip="关闭" aria-label="关闭">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div class="tk-modal-body">
          <div class="tk-form-row">
            <label>标题 <span class="tk-req">*</span></label>
            <input type="text" id="tkFormTitle" autocomplete="off" placeholder="输入任务标题">
          </div>
          <div class="tk-form-row">
            <label>描述</label>
            <textarea id="tkFormDesc" rows="3" placeholder="输入任务描述"></textarea>
          </div>
          <div class="tk-form-grid">
            <div class="tk-form-field">
              <label>状态</label>
              <select id="tkFormStatus"></select>
            </div>
            <div class="tk-form-field">
              <label>优先级</label>
              <select id="tkFormPriority"></select>
            </div>
            <div class="tk-form-field">
              <label>处理人</label>
              <select id="tkFormAssignee"></select>
            </div>
            <div class="tk-form-field">
              <label>项目</label>
              <select id="tkFormProject"></select>
            </div>
            <div class="tk-form-field">
              <label>截止日期</label>
              <input type="date" id="tkFormDue">
            </div>
            <div class="tk-form-field">
              <label>标签</label>
              <input type="text" id="tkFormLabels" autocomplete="off" placeholder="逗号分隔">
            </div>
          </div>
        </div>
        <div class="tk-modal-foot">
          <button class="tk-btn-ghost" id="tkModalCancel">取消</button>
          <button class="tk-btn-primary" id="tkModalSave">保存</button>
        </div>
      </div>
    </div>
