<!-- 技能开发：卡片「⋯」菜单与提交技能的路径选择（对照 Lingee Build 技能开发页），脚本见 scripts/pages/skill-submit.js -->
<div class="agent-card-menu skill-card-menu" id="skillCardMenu" role="menu" hidden>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-skill-action="edit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>编辑</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-skill-action="local-test"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6L4.5 19a1.5 1.5 0 0 0 1.3 2.2h12.4a1.5 1.5 0 0 0 1.3-2.2L14 9V3"/><path d="M7.5 15h9"/></svg>本地测试</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-skill-action="cloud-test"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.7-9h1.8a4 4 0 0 1 0 8z"/></svg>云端测试</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-skill-action="check"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m8.5 12.5 2.5 2.5 4.5-5"/></svg>检查</button>
  <button type="button" class="agent-card-menu-item" role="menuitem" data-skill-action="submit"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg>提交</button>
  <button type="button" class="agent-card-menu-item is-danger" role="menuitem" data-skill-action="delete"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>删除</button>
</div>
<div class="skill-submit-overlay" id="skillSubmitOverlay" hidden>
  <div class="skill-submit-card" role="dialog" aria-modal="true" aria-labelledby="skillSubmitTitle">
    <div class="skill-submit-head">
      <h3 id="skillSubmitTitle">提交技能 · 选择路径</h3>
      <button type="button" class="skill-submit-close" data-skill-submit-close aria-label="关闭"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="skill-submit-options" role="radiogroup" aria-label="提交路径">
      <label class="skill-submit-option">
        <input type="radio" name="skillSubmitPath" value="enterprise" checked>
        <span class="skill-submit-title"><span class="skill-submit-icon is-enterprise" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 10h5a1 1 0 0 1 1 1v10M3 21h18M8 8h2M8 12h2M8 16h2"/></svg></span>企业分发</span>
        <small>适合团队协作与知识沉淀，技能可共享给他人或发布至企业市场</small>
      </label>
      <label class="skill-submit-option">
        <input type="radio" name="skillSubmitPath" value="personal">
        <span class="skill-submit-title"><span class="skill-submit-icon is-personal" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg></span>个人自用</span>
        <small>适合本人独立使用，安全检测通过后即时安装到 Work，无需审核</small>
      </label>
    </div>
    <p class="skill-submit-hint"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="currentColor"/><path d="M12 11v6M12 7.5v.01" stroke="#fff" stroke-width="2" stroke-linecap="round"/></svg><span id="skillSubmitHint">企业分发将对团队成员或市场开放，需管理员审核后生效。</span></p>
    <div class="skill-submit-foot">
      <button type="button" class="skill-submit-cancel" data-skill-submit-close>取消</button>
      <button type="button" class="skill-submit-ok" id="skillSubmitOk">提交</button>
    </div>
  </div>
</div>
