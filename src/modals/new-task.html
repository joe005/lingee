<div class="sync-overlay" id="cv-newtask-overlay" style="display:none" onclick="if(event.target===this)cvCloseNewTask()">
  <div class="nt-modal" role="dialog" aria-modal="true" aria-labelledby="cv-nt-dialog-title">
    <div class="nt-head">
      <div class="nt-crumb"><span>任务</span><span class="nt-crumb-arrow" aria-hidden="true">›</span><strong id="cv-nt-dialog-title"><span id="cv-nt-mode-label">手动创建</span></strong></div>
      <button type="button" class="sync-modal__close" aria-label="关闭新增任务" onclick="cvCloseNewTask()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="nt-parent-banner hidden" id="cv-nt-parent-banner">
      <span>正在为「<b id="cv-nt-parent-title"></b>」新增子任务</span>
    </div>
    <div class="nt-body">
      <div class="nt-main" id="cv-nt-manual">
        <label class="nt-field nt-field--title" for="cv-nt-title"><span class="sr-only">任务标题</span><input class="nt-title" id="cv-nt-title" placeholder="任务标题" maxlength="120"></label>
        <label class="nt-field nt-field--desc" for="cv-nt-desc"><span class="sr-only">任务描述</span><textarea class="nt-desc" id="cv-nt-desc" rows="3" placeholder="添加描述..."></textarea></label>
        <div class="nt-context">创建后任务将进入 <strong id="cv-nt-status-chip">待办</strong>，由所选执行人推进。</div>
        <div class="nt-flow-field hidden" id="cv-nt-stages-field">
          <div class="nt-section-head"><h3>阶段分工 <span id="cv-nt-stage-count"></span></h3><span>点击节点选择阶段，在节点下方指定执行人</span></div>
          <div class="nt-flow" id="cv-nt-stage-list"></div>
        </div>
      </div>
      <div class="nt-agent hidden" id="cv-nt-agent">
        <div class="nt-agent-intro"><span class="nt-agent-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3 1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="m19 15 .7 1.8 1.8.7-1.8.7-.7 1.8-.7-1.8-1.8-.7 1.8-.7L19 15Z"/></svg></span><div><strong>把任务交给 Agent</strong><p>描述目标、背景和期望结果；创建的任务默认设为多人协作，Agent 会尝试识别项目与负责人。</p></div></div>
        <label class="nt-agent-prompt" for="cv-nt-prompt"><textarea class="nt-desc" id="cv-nt-prompt" aria-label="任务描述" rows="8" placeholder="例如：完善采购审批流程，补上异常处理和回归测试。期望审批记录能追溯到申请人、审批人和处理时间。"></textarea><span class="nt-prompt-hint">写清楚要解决的问题，以及怎样算完成</span></label>
      </div>
    </div>
    <div class="nt-property-bar" id="cv-nt-properties">
      <span class="nt-property nt-property--status" aria-label="任务状态"><span class="nt-status-ring" aria-hidden="true"></span><span id="cv-nt-status-property">待办</span></span>
      <label class="nt-property nt-property--priority" for="cv-nt-priority"><span class="sr-only">优先级</span><select id="cv-nt-priority"><option>无优先级</option><option>高</option><option>中</option><option>低</option></select></label>
      <label class="nt-property nt-property--project" for="cv-nt-project"><span class="sr-only">项目</span><select id="cv-nt-project"></select></label>
      <label class="nt-property nt-property--assignee" id="cv-nt-single-field" for="cv-nt-people"><span class="sr-only">负责人</span><select class="nt-assignee-select" id="cv-nt-people" data-person-select></select></label>
      <button type="button" class="nt-property nt-property--tags" id="cv-nt-tags-trigger">添加标签</button>
      <section class="nt-execution" id="cv-nt-execution" aria-labelledby="cv-nt-exec-title">
        <div class="nt-section-head"><h3 id="cv-nt-exec-title" class="sr-only">执行方式（必填）</h3></div>
        <div class="nt-seg" id="cv-nt-exec-mode" role="radiogroup" aria-labelledby="cv-nt-exec-title" aria-required="true">
          <button type="button" class="nt-seg-btn on" data-nt-exec="单人执行" role="radio" aria-checked="true" tabindex="0"><b>单人执行</b></button>
          <button type="button" class="nt-seg-btn" data-nt-exec="多人协作" role="radio" aria-checked="false" tabindex="-1"><b>多人协作</b></button>
        </div>
      </section>
      <details class="nt-more" id="cv-nt-more">
        <summary aria-label="更多设置">···</summary>
        <div class="nt-more-body">
          <div class="nt-field"><span class="nt-label">标签</span><div class="nt-chips" id="cv-nt-tags"><span id="cv-nt-tag-list"></span><button type="button" class="nt-chip nt-chip--add" id="cv-nt-addtag">＋ 添加标签</button></div></div>
          <div class="nt-field"><span class="nt-label">附件</span><div class="nt-attach" id="cv-nt-attach"><div class="nt-attach-drop" id="cv-nt-file-list"></div></div></div>
        </div>
      </details>
    </div>
    <div class="nt-foot">
      <button type="button" class="nt-attach-trigger" id="cv-nt-attach-trigger" aria-label="添加附件" title="添加附件"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m21.4 11.6-8.5 8.5a6 6 0 0 1-8.5-8.5l9-9a4 4 0 0 1 5.7 5.7l-9 9a2 2 0 0 1-2.8-2.8l8.5-8.5"/></svg><span id="cv-nt-attach-count"></span></button>
      <div class="nt-foot-right">
        <button type="button" class="nt-agent-trigger" id="cv-nt-agent-trigger" data-nt-mode="agent" aria-pressed="false">↔ 切换到 Agent 创建</button>
        <button type="button" class="nt-agent-trigger nt-agent-trigger--back hidden" id="cv-nt-manual-trigger" data-nt-mode="manual" aria-pressed="true">↔ 切换到手动创建</button>
        <button type="button" class="nt-btn" id="cv-nt-continue">继续创建</button>
        <button type="button" class="nt-btn nt-btn--primary" id="cv-nt-submit">创建任务</button>
      </div>
    </div>
  </div>
</div>
