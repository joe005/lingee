<!-- 登录 / 添加 Git 账号（features/collab/local-dev/auth-dialog.js）。设置页、空间表单与任务对话共用。
     按 UE：平台下拉（金蝶 GitLab / GitHub / Gitee / 其他 GitLab）→ Git 账号（主机 · 平台，只读；其他 GitLab 可填平台地址）→ 访问令牌 →
     常显的获取步骤。从账号卡片或空间进入时平台已知并锁定。一期只用访问令牌。 -->
<div class="sync-overlay ld-overlay ld-overlay--top" id="ldAuthOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--auth" role="dialog" aria-modal="true" aria-labelledby="ldAuthTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldAuthTitle">登录 Git 账号</span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-auth-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body ld-auth-form">
      <div class="ld-form-field">
        <span class="ld-form-label" id="ldAuthPlatformLabel">平台</span>
        <div class="ld-select-wrap" id="ldAuthPlatformWrap">
          <button type="button" class="ld-select" id="ldAuthPlatform" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="ldAuthPlatformLabel ldAuthPlatform"><span class="ld-select-opt"><span id="ldAuthPlatformLogo"></span><span id="ldAuthPlatformText">金蝶 GitLab</span></span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
          <div class="ld-select-menu" id="ldAuthPlatformMenu" role="listbox" aria-labelledby="ldAuthPlatformLabel" hidden></div>
        </div>
      </div>
      <div class="ld-form-field">
        <label class="ld-form-label" for="ldAuthHost">Git 账号</label>
        <input type="text" id="ldAuthHost" class="ld-input ld-auth-host" autocomplete="off" spellcheck="false" readonly aria-describedby="ldAuthError">
      </div>
      <div class="ld-form-field">
        <div class="ld-label-row"><label class="ld-form-label" for="ldAuthToken">访问令牌</label><button type="button" class="ld-link" id="ldAuthCreate">去平台创建</button></div>
        <input type="password" id="ldAuthToken" class="ld-input ld-auth-token" autocomplete="off" spellcheck="false" placeholder="请输入" aria-describedby="ldAuthHint ldAuthError">
        <p class="ld-hint ld-hint--line" id="ldAuthHint"></p>
      </div>
      <div class="ld-form-field">
        <span class="ld-form-label">如何获取访问令牌</span>
        <ol class="ld-guide-steps" id="ldAuthGuideSteps"></ol>
      </div>
      <p class="ld-error" id="ldAuthError" role="alert" hidden></p>
    </div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-auth-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldAuthSubmit">验证并登录</button>
    </div>
  </div>
</div>
