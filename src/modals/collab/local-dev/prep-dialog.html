<!-- 准备执行环境（features/collab/local-dev/prep-dialog.js）：执行前检查发现空间未在本机初始化时打开，完成后继续执行任务。 -->
<div class="sync-overlay ld-overlay" id="ldPrepOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--space" role="dialog" aria-modal="true" aria-labelledby="ldPrepTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldPrepTitle">准备执行环境</span>
        <span class="ld-modal-sub" id="ldPrepSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-prep-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body ld-space-form" id="ldPrepBody"></div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" id="ldPrepStop" hidden>停止</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--outline" id="ldPrepBg" hidden>后台初始化</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" id="ldPrepCancel" data-ld-prep-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldPrepDone" disabled>完成并执行</button>
    </div>
  </div>
</div>
