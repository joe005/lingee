<!-- 初始化 / 修改空间本机目录（features/collab/local-dev/space-dir-dialog.js）：一个空间一个目录，各仓库共用。 -->
<div class="sync-overlay ld-overlay" id="ldSpaceDirOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--space" role="dialog" aria-modal="true" aria-labelledby="ldSpaceDirTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldSpaceDirTitle">初始化本机目录</span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-spacedir-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body ld-space-form" id="ldSpaceDirBody"></div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-spacedir-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldSpaceDirDone">初始化</button>
    </div>
  </div>
</div>
