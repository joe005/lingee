<!-- 本地开发 · 准备环境与 Git 认证弹窗。
     开发在 Lingee 桌面客户端本地执行：Git 随客户端内置，用户只需按平台配置一次访问令牌，
     再为项目绑定本地目录（自动拉取或使用已有目录）。内容由 features/collab/local-dev.js 渲染。 -->
<div class="sync-overlay ld-overlay" id="ldSetupOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal" role="dialog" aria-modal="true" aria-labelledby="ldSetupTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldSetupTitle">配置本地环境</span>
        <span class="ld-modal-sub" id="ldSetupSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-setup-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body" id="ldSetupBody"></div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-setup-close>稍后</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldSetupDone" disabled>完成</button>
    </div>
  </div>
</div>
<div class="sync-overlay ld-overlay" id="ldProjectOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--project" role="dialog" aria-modal="true" aria-labelledby="ldProjectTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldProjectTitle">项目设置</span>
        <span class="ld-modal-sub" id="ldProjectSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-project-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body" id="ldProjectBody"></div>
  </div>
</div>
<div class="sync-overlay ld-overlay ld-overlay--top" id="ldAuthOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--auth" role="dialog" aria-modal="true" aria-labelledby="ldAuthTitle">
    <div class="sync-modal__header">
      <span class="sync-modal__title" id="ldAuthTitle">Git 认证</span>
      <button type="button" class="sync-modal__close" data-ld-auth-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="ld-field">
        <label for="ldAuthHost">平台</label>
        <div class="ld-auth-row">
          <input type="text" id="ldAuthHost" class="ld-input" autocomplete="off" spellcheck="false">
          <select id="ldAuthPlatform" class="ld-input ld-select" aria-label="平台类型">
            <option value="GitLab">GitLab</option>
            <option value="GitHub">GitHub</option>
            <option value="Gitee">Gitee</option>
            <option value="云效 Codeup">云效 Codeup</option>
          </select>
        </div>
      </div>
      <div class="ld-field">
        <div class="ld-label-row"><label for="ldAuthToken">访问令牌</label><button type="button" class="ld-link" id="ldAuthCreate">如何获取？</button></div>
        <div class="ld-token-wrap">
          <input type="password" id="ldAuthToken" class="ld-input" autocomplete="off" spellcheck="false" aria-describedby="ldAuthError">
          <button type="button" class="ld-icon-btn" id="ldAuthEye" aria-label="显示令牌" aria-pressed="false"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
        <p class="ld-error" id="ldAuthError" role="alert" hidden></p>
      </div>
    </div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-auth-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldAuthSubmit">保存</button>
    </div>
  </div>
</div>
<div class="ld-reminder" id="ldReminder" role="status" aria-live="polite" hidden></div>
