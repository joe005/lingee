<!-- 本地开发 · 项目设置、初始化项目 / 更改项目目录、登录或添加 Git 账号弹窗，以及顶部「本地环境」状态浮层。
     智能配置在对话里由「本地环境配置」技能完成（composer/local-env-chat.js）。内容由 features/collab/local-dev.js 渲染。 -->
<div class="sync-overlay ld-overlay" id="ldDirOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal" role="dialog" aria-modal="true" aria-labelledby="ldDirTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldDirTitle">更改项目目录</span>
        <span class="ld-modal-sub" id="ldDirSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-dir-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body" id="ldDirBody"></div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-dir-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldDirDone" disabled>初始化</button>
    </div>
  </div>
</div>
<div class="sync-overlay ld-overlay" id="ldProjectOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--project" role="dialog" aria-modal="true" aria-labelledby="ldProjectTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldProjectTitle">项目设置</span>
        <span class="ld-modal-sub" id="ldProjectSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-project-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body" id="ldProjectBody"></div>
  </div>
</div>
<div class="sync-overlay ld-overlay ld-overlay--top" id="ldAuthOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--auth" role="dialog" aria-modal="true" aria-labelledby="ldAuthTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldAuthTitle">登录 Git 账号</span>
        <span class="ld-modal-sub" id="ldAuthSub"></span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-auth-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <!-- 平台通常已知（标题下注明主机和类型）；「添加账号」时单选平台：金蝶 GitLab、GitHub、Gitee 自动带出地址，
           「其他 GitLab」才填写地址。一期只用访问令牌，获取步骤在下方可展开 -->
      <div class="ld-field" id="ldAuthPlatformBox" hidden>
        <span class="ld-field-label" id="ldAuthPlatformLabel">平台</span>
        <div class="ld-segment" role="radiogroup" aria-labelledby="ldAuthPlatformLabel">
          <button type="button" class="ld-segment-item" role="radio" data-ld-auth-platform="KDGitLab" title="git.kingdee.com">金蝶 GitLab</button>
          <button type="button" class="ld-segment-item" role="radio" data-ld-auth-platform="GitHub">GitHub</button>
          <button type="button" class="ld-segment-item" role="radio" data-ld-auth-platform="Gitee">Gitee</button>
          <button type="button" class="ld-segment-item" role="radio" data-ld-auth-platform="GitLab">其他 GitLab</button>
        </div>
        <p class="ld-hint" id="ldAuthHostShow"></p>
      </div>
      <div class="ld-field" id="ldAuthHostBox" hidden>
        <label for="ldAuthHost">平台地址</label>
        <input type="text" id="ldAuthHost" class="ld-input ld-auth-host" autocomplete="off" spellcheck="false" placeholder="如 git.kingdee.com" aria-describedby="ldAuthError">
      </div>
      <div class="ld-field ld-field--token">
        <div class="ld-label-row"><label for="ldAuthToken">访问令牌</label><button type="button" class="ld-link" id="ldAuthCreate">去平台创建</button></div>
        <input type="password" id="ldAuthToken" class="ld-input ld-auth-token" autocomplete="off" spellcheck="false" aria-describedby="ldAuthHint ldAuthError">
        <p class="ld-hint ld-hint--line" id="ldAuthHint"></p>
      </div>
      <details class="ld-guide" id="ldAuthGuide">
        <summary>如何获取访问令牌？</summary>
        <ol id="ldAuthGuideSteps"></ol>
      </details>
      <p class="ld-error" id="ldAuthError" role="alert" hidden></p>
    </div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-auth-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldAuthSubmit">验证并登录</button>
    </div>
  </div>
</div>
<!-- 新建空间：与 Manage「新建空间」的开发空间（测试研发项目模版）格式一致——空间名称、空间目标、Git 地址 + 基准分支；
     Git 地址粘贴后自动校验格式与连通性，另选本机目录，创建后在 Manage 生成空间并初始化到本机。内容由 features/collab/local-dev.js 渲染 -->
<div class="sync-overlay ld-overlay ld-overlay--repo" id="ldRepoOverlay" style="display:none" aria-hidden="true">
  <div class="sync-modal ld-modal ld-modal--repo" role="dialog" aria-modal="true" aria-labelledby="ldRepoTitle">
    <div class="sync-modal__header">
      <div class="ld-modal-head">
        <span class="sync-modal__title" id="ldRepoTitle">新建空间</span>
      </div>
      <button type="button" class="sync-modal__close" data-ld-repo-close aria-label="关闭"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="ld-field">
        <label class="ld-field-label" for="ldRepoName">空间名称 <b class="ld-req" aria-hidden="true">*</b></label>
        <input type="text" id="ldRepoName" class="ld-input ld-repo-name" maxlength="60" placeholder="请描述你的空间名称" autocomplete="off">
      </div>
      <div class="ld-field">
        <label class="ld-field-label" for="ldRepoGoal">空间目标 <b class="ld-req" aria-hidden="true">*</b></label>
        <textarea id="ldRepoGoal" class="ld-input ld-textarea" rows="3" maxlength="300"></textarea>
      </div>
      <div class="ld-field">
        <label class="ld-field-label" for="ldRepoUrl">Git 地址 <b class="ld-req" aria-hidden="true">*</b></label>
        <div class="ld-repo-git-row">
          <input type="url" id="ldRepoUrl" class="ld-input ld-repo-url" placeholder="https://github.com/org/repo" autocomplete="off" spellcheck="false" aria-describedby="ldRepoCheck">
          <span class="ld-repo-branch-box"><svg class="ld-repo-branch-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="5" r="2"/><circle cx="6" cy="19" r="2"/><circle cx="18" cy="8" r="2"/><path d="M6 7v10"/><path d="M18 10c0 4-6 3-12 7"/></svg><select id="ldRepoBranch" class="ld-input" aria-label="基准分支"></select></span>
          <input type="text" id="ldRepoBranchCustom" class="ld-input ld-repo-branch-custom" placeholder="分支名，如 release/2026" autocomplete="off" spellcheck="false" aria-label="自定义基准分支" hidden>
        </div>
        <div class="ld-repo-check" id="ldRepoCheck" role="status" aria-live="polite"></div>
        <p class="ld-error" id="ldRepoBranchHint" hidden></p>
      </div>
      <div class="ld-field ld-field--last">
        <span class="ld-field-label" id="ldRepoDirLabel">本机目录</span>
        <div id="ldRepoDir"></div>
      </div>
      <div id="ldRepoProgress"></div>
    </div>
    <div class="sync-modal__footer">
      <button type="button" class="sync-modal__btn sync-modal__btn--ghost" data-ld-repo-close>取消</button>
      <button type="button" class="sync-modal__btn sync-modal__btn--primary" id="ldRepoSubmit" disabled>创建并初始化</button>
    </div>
  </div>
</div>
<div class="ld-nav-pop" id="ldNavPop" role="dialog" aria-label="本地环境未就绪" hidden></div>
