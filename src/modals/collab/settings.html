<div class="sync-overlay" id="cv-addmember-overlay" style="display:none" onclick="if(event.target===this)cvCloseAddMemberModal()">
  <div class="sync-modal" style="width:520px">
    <div class="sync-modal__header">
      <h3 class="sync-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="22" y1="11" x2="16" y2="11"/></svg>添加协作人员</h3>
      <button class="sync-modal__close" onclick="cvCloseAddMemberModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="sync-modal__field">
        <label class="sync-modal__label">选择工作区人员</label>
        <div class="search-wrap" style="margin-bottom:12px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#b5b5ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="cv-tp-search" type="search" autocomplete="off" data-1p-ignore data-lpignore="true" placeholder="搜索姓名、邮箱..." onkeyup="cvSearchThirdPartyMembers(this.value)" /></div>
      </div>
      <div class="sync-modal__field">
        <div id="cv-tp-list" style="max-height:360px;overflow-y:auto"></div>
      </div>
    </div>
    <div class="sync-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseAddMemberModal()">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmAddMembers()">添加选中</button>
    </div>
  </div>
</div>

<div class="sync-overlay" id="cv-newsquad-overlay" style="display:none" onclick="if(event.target===this)cvCloseNewSquadModal()">
  <div class="sync-modal" style="width:420px">
    <div class="sync-modal__header">
      <h3 class="sync-modal__title"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>新建团队</h3>
      <button class="sync-modal__close" onclick="cvCloseNewSquadModal()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
    </div>
    <div class="sync-modal__body">
      <div class="sync-modal__field">
        <label class="sync-modal__label">团队名称</label>
        <input id="cv-ns-name" placeholder="如：CRM系统开发团队" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none" />
      </div>
      <div class="sync-modal__field">
        <label class="sync-modal__label">描述（可选）</label>
        <input id="cv-ns-desc" placeholder="一句话说明团队职责" style="width:100%;padding:8px 10px;border:1px solid var(--border-hover);border-radius:8px;font-size:13px;color:var(--text);outline:none" />
      </div>
    </div>
    <div class="sync-modal__footer">
      <button class="sync-modal__btn sync-modal__btn--ghost" onclick="cvCloseNewSquadModal()">取消</button>
      <button class="sync-modal__btn sync-modal__btn--primary" onclick="cvConfirmNewSquad()">创建</button>
    </div>
  </div>
</div>
