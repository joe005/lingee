order_confirmation_policy:
  mode: precheck_then_approved_resumable_purchase_batch
  test_stop_point: 测试在 DryRun、精确清单和授权提示生成后停止；测试不得创建资源或支付。
  independent_payment_api_called: false
  create_api_may_charge_or_freeze_funds: true
  forbid_payment_in_test: true
  agent_write_allowed_after_exact_batch_approval: true
  unapproved_batch_write_forbidden: true
  approval_reuse_for_different_manifest_forbidden: true
  approved_batch_resume_requires_explicit_failure_decision: true
  high_value_monthly_threshold_cny: 1000
  high_value_policy: 月成本超过 1000 元时只生成订单交接清单，由用户在腾讯云控制台确认并支付。
  requires_customer_confirmation_before_order_generation: true
  requires_customer_confirmation_before_payment: true
  requires_voucher_query_and_customer_choice: true
  resource_tags:
    -
      Key: from
      Value: tencentcloud-vibe-deploy-skill
  tagging_policy_reference: references/13-purchase-precheck-and-approval.md
  resource_checklist:
    - Lighthouse：1 台 综合服务器套餐，套餐配置：通用型，2 核 CPU，4GB 内存，90GB 系统盘；公网：6 Mbps 峰值带宽，套餐内流量包：800GB/月；纯系统镜像：Ubuntu 24.04 LTS
  precheck:
    - 先读 references/13-purchase-precheck-and-approval.md，确认各资源的标签方式和代金券处理边界。
    - Lighthouse 先用 `DescribeBundles` 匹配套餐和可售可用区，用 `DescribeBlueprints` 选择镜像，再用带单一 `--Zones` 的 `CreateInstances --DryRun true` 做购买预检。
    - 查询未使用且适用于预付费新购的代金券，展示候选后询问用户是否使用。
    - 先执行价格、可用区、库存、配额和参数预检。
    - 能使用 DryRun 的 API，先使用 DryRun=true；DryRun 通过不代表已生成订单。
    - 向用户展示资源清单、地域、计费方式、真实价格和费用变化，取得仅适用于本清单的一次性明确授权。
  cvm_order_boundary: CVM RunInstances 不提供安全的只生成未支付订单阶段；DryRun=true 只预检不会创建资源，DryRun=false 会直接创建实例，预付费会扣款，后付费会冻结费用；仅当月成本不超过 1000 元且用户对本次精确清单明确授权时，Agent 才可执行一次。
  hai_order_boundary: ""
  lighthouse_order_boundary: Lighthouse 可通过 tccli lighthouse InquirePriceCreateInstances 询价，通过 tccli lighthouse CreateInstances 创建实例；CreateInstances 支持 DryRun=true，但必须显式传单一 Zones。方案已明确独立数据盘时，主机、磁盘购买和附加关系进入同一组合审批；执行时先创建主机并核验实际可用区，再刷新云盘库存、价格、代金券和余额，符合原清单后才创建并附加。
  order_query_capabilities:
    -
      product: Lighthouse 轻量应用服务器
      query: "tccli lighthouse InquirePriceCreateInstances --region <region> --BundleId <BundleId> --InstanceChargePrepaid '{\"Period\":1,\"RenewFlag\":\"NOTIFY_AND_MANUAL_RENEW\"}' --InstanceCount <count>\ntccli lighthouse CreateInstances --region <region> --Zones '[\"<placement_zone>\"]' --BundleId <BundleId> --BlueprintId <BlueprintId> --InstanceChargePrepaid '{\"Period\":1,\"RenewFlag\":\"NOTIFY_AND_MANUAL_RENEW\"}' --InstanceCount <count> --DryRun true"
      notes: Lighthouse CreateInstances 支持 DryRun；必须显式绑定查价确认的单一可用区，并核对 BundleId、BlueprintId、地域、数量和费用。
  resource_verification:
    - 如果 API 返回 DealName，优先用对应产品的 DescribeOrders 查询订单详情并核对资源清单。
    - 如果 API 返回 InstanceIdSet 或资源 ID，使用 DescribeInstancesStatus、DescribeInstances、DescribeDisks 等查询资源状态和规格。
    - 如果创建的是 HAI，使用 `tccli hai DescribeInstances` 查询实例状态、规格和地域。
    - 如果创建的是 Lighthouse，按实例 ID 查询实际地域和可用区；独立数据盘创建前后都用 verify_resource_placement.py 核验同地域、同可用区关系。
    - 把查询结果与 purchase-checklist.html、plans/purchase-checklist.yaml 和本 JSON 的 resources_to_purchase 对照。
    - 核对通过后报告结果；已在组合审批中明确的数据盘附加不重复询问，格式化/挂载及其他新的创建、扩容、续费或删除必须重新展示精确清单并取得明确授权。
deployment_shape:
  open_source_architecture:
    - Caddy/Nginx 负责接收用户访问，并把请求转给应用。
    - 按项目现有线索选择部署方式：已有 Docker/Compose 则容器部署；否则使用 systemd 管理普通进程或二进制程序。
    - Restic 或定时脚本做备份，备份位置由客户后续指定。
    - 防火墙只开放 SSH、HTTP/HTTPS 和必要应用端口。
  suitability:
    - 个人演示
    - MVP
    - 低流量小工具
  tradeoffs:
    - 成本最低
    - 只有一台机器，坏了会整体不可用
    - 应用和数据会抢同一台机器的资源
    - 为控制成本不配置独立数据盘，业务数据与系统共盘；重装、扩容和故障恢复前必须先完成备份。
  capacity_note: 适合低频访问、个人项目、Demo 或小范围试用。
compliance_summary:
  reminder_level: conditional
  summary: 计划使用中国大陆地域公网服务。当前未提供域名；若后续绑定真实域名，需要先确认 ICP 备案或腾讯云接入备案。
  reference_urls:
    - "https://cloud.tencent.com/document/product/243/18907"
    - "https://cloud.tencent.com/document/product/243/39038"
  purchase_decision_oral_reminder: 提醒一下：这个方案会使用中国大陆地域的公网服务。现在还没确定域名；如果后续要绑定真实域名，购买和上线前需要先确认 ICP 备案或腾讯云接入备案，备案后上线 30 日内还要做公安联网备案。
