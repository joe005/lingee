      count: 1
      spec: 公网负载均衡，HTTPS/HTTP 监听，20Mbps 起步，后端绑定多台应用 CVM
      purpose: 作为高扩展性方案的统一公网入口，负责 TLS 终止、健康检查和流量分发
      billing_items:
        - CLB 实例
        - 公网带宽/流量
        - LCU/连接数等规格项
        - 证书与监听配置按实际账单
      dependency: public_entry
      notes:
        - 高扩展性方案不使用单台 CVM 充当入口负载均衡，避免入口本身成为单点。
      layer: access
      public_bandwidth_mbps: 20
      public_network_billing_mode: fixed_bandwidth
      internet_charge_type: BANDWIDTH_PREPAID
      bandwidth_range_mbps: 20-100
      bandwidth_selection_reason: 按高扩展方案 20Mbps 起步选择 20Mbps，后续可按访问量扩容到 100Mbps 或更高。
      bandwidth_billing_advice: 查价按固定带宽；访问量较稳定或需要预算可控时，优先使用固定带宽计费。
      traffic_billing_alternative:
        internet_charge_type: TRAFFIC_POSTPAID_BY_HOUR
        when_to_use: 流量波动大、无法准确预估流量、早期试运行且需要为实际出流量付费时考虑。
        caveat: 按流量计费的最终账单取决于真实公网出方向流量，报告中的月/年价格不把未知流量硬估进去。
  purchase_lines:
    - CVM：2 台 应用服务器，SA9 机型，4c / 8G / 50GB / 160GB，公网带宽：无需配置公网带宽
    - CVM：1 台 监控和备份服务器，SA9 机型，2c / 4G / 50GB / 160GB，公网带宽：无需配置公网带宽
    - Tencent Cloud CLB：1 个，公网负载均衡，HTTPS/HTTP 监听，20Mbps 起步，后端绑定多台应用 CVM
