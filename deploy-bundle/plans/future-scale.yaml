    - 用户主应用程序
    - Caddy/Nginx 静态文件和 HTTPS
    - 备份脚本
order_confirmation_policy:

deployment_shape:
  open_source_architecture:
    - 腾讯云 CLB 负责统一公网入口、HTTPS 监听、健康检查和流量分发，不用单台 CVM 充当入口负载均衡。
    - 至少两台 App CVM 同时跑应用，流量变大时可以继续加机器。
    - 当前未检测到必须独立购买的托管数据库、Redis、MQ 或 COS；先用应用 CVM 数据盘承载运行数据和配置。
    - 单独放应用侧监控和配置备份；后续出现明确数据依赖时，再引入对应腾讯云托管产品。
  suitability:
    - 用户量增长
    - 需要横向增加应用节点
    - 需要更明确故障隔离的项目
  tradeoffs:
    - 成本最高
    - 资源数量更多
    - 当前未检测到必须拆出的托管数据产品，购买前需确认是否真的需要高扩展性方案
  capacity_note: 适合更高访问量或增长预期明确的服务，当前主要扩容点是 CLB 后的应用 CVM；后续有明确数据依赖后再拆托管产品。
compliance_summary:
  reminder_level: conditional
  summary: 计划使用中国大陆地域公网服务。当前未提供域名；若后续绑定真实域名，需要先确认 ICP 备案或腾讯云接入备案。
  reference_urls:
    - "https://cloud.tencent.com/document/product/243/18907"
    - "https://cloud.tencent.com/document/product/243/39038"
  purchase_decision_oral_reminder: 提醒一下：这个方案会使用中国大陆地域的公网服务。现在还没确定域名；如果后续要绑定真实域名，购买和上线前需要先确认 ICP 备案或腾讯云接入备案，备案后上线 30 日内还要做公安联网备案。
