<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lingee — 开发 · 新任务</title>
<link rel="stylesheet" href="../_shared/base.css">
<link rel="stylesheet" href="../_shared/sidebar.css">
<style>
  /* ============ MAIN ============ */
  .main{
    flex:1;display:flex;flex-direction:column;position:relative;
    background:
      radial-gradient(60% 45% at 50% 42%, rgba(120,120,255,.035), transparent 70%),
      var(--bg);
  }
  .main-center{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 24px;margin-top:-40px;
  }
  .greeting{
    display:flex;align-items:center;gap:16px;
    font-size:34px;font-weight:600;letter-spacing:.5px;margin-bottom:34px;color:#2e2e2e;
  }
  .mascot{width:46px;height:46px;flex:none;object-fit:contain;display:block}

  /* composer */
  .composer{
    width:100%;max-width:800px;background:#fff;border:1px solid var(--border);
    border-radius:var(--r-2xl);box-shadow:var(--shadow-composer);padding:18px 20px 14px;
  }
  .composer-input{
    color:var(--text-soft);font-size:15px;padding:2px 4px 22px;min-height:24px;outline:none;
  }
  .composer-input:empty:before{content:attr(data-placeholder);color:var(--text-soft);pointer-events:none}
  .composer-bar{display:flex;align-items:center;gap:8px}
  .round-btn{
    width:32px;height:32px;border-radius:50%;border:1px solid var(--border);
    background:#fff;display:flex;align-items:center;justify-content:center;
    color:#5a5a5f;cursor:pointer;flex:none;
  }
  .round-btn:hover{background:var(--hover)}
  .chip{
    display:flex;align-items:center;gap:5px;
    padding:6px 12px;border-radius:var(--r-full);border:1px solid var(--border);
    background:#fff;color:#3a3a3d;font-size:13px;cursor:pointer;white-space:nowrap;font-weight:500;
    position:relative;
  }
  .chip:hover{background:var(--hover)}
  .chip.muted{color:var(--text-muted)}
  .chip .caret-sm{width:13px;height:13px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .spacer{flex:1}
  .send-btn{
    width:36px;height:36px;border-radius:50%;
    background:#f0f0f2;border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    color:#9a9aa0;cursor:pointer;flex:none;
  }
  .send-btn.active{background:#2d2d2d;color:#fff;border-color:#2d2d2d}

  /* dropdown */
  .dropdown{position:relative}
  .menu{
    position:absolute;top:calc(100% + 10px);left:0;
    min-width:150px;background:#fff;border:1px solid var(--border);
    border-radius:var(--r-lg);box-shadow:var(--shadow-menu);
    padding:6px;z-index:20;display:none;
  }
  .dropdown.open > .menu{display:block}
  .dropdown.open > .chip{background:var(--hover)}
  .menu-item{
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:8px 10px;border-radius:9px;cursor:pointer;color:var(--text);font-size:14px;
  }
  .menu-item:hover{background:var(--hover)}
  .menu-item .left{display:flex;align-items:center;gap:9px}
  .menu-check{color:#1a1a1a;visibility:hidden}
  .menu-item.checked .menu-check{visibility:visible}
  .menu-sep{height:1px;background:var(--border);margin:6px 4px}

  /* selected app chip */
  .chip.selected{background:#f2f5ff;border-color:var(--brand-border);color:#2d2d2d}
  .chip.selected .chip-label{color:var(--brand-text);font-weight:600}
  .chip .app-dot{width:6px;height:6px;border-radius:50%;background:var(--brand-text);flex:none;display:none}
  .chip.selected .app-dot{display:block}

  .main-foot{text-align:center;padding:16px;color:var(--text-soft);font-size:12px}
</style>
</head>
<body>

<!-- ===================== SIDEBAR ===================== -->
<aside class="sidebar">
  <div class="sb-head">
    <div class="brand">Lingee</div>
    <div class="sb-head-icons">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
      <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
    </div>
  </div>

  <div class="seg">
    <div class="seg-item" onclick="location.href='../对话/index.html'">
      <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.5 8.5 0 1 1 21 11.5z"/></svg>
      对话
    </div>
    <div class="seg-item" onclick="location.href='../工作/index.html'">
      <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
      工作
    </div>
    <div class="seg-item active">
      <svg class="ic ic-sm" viewBox="0 0 24 24"><path d="m16 18 6-6-6-6"/><path d="m8 6-6 6 6 6"/></svg>
      开发
    </div>
  </div>

  <div class="sb-scroll">
    <div class="nav-item active">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
      新任务
    </div>
    <div class="nav-item" onclick="location.href='skills.html'">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18M3 12h18"/></svg>
      技能开发
    </div>
    <div class="nav-item" onclick="location.href='agents.html'">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="12" rx="2"/><path d="M12 8V4M9 14h.01M15 14h.01"/></svg>
      智能体开发
    </div>
    <div class="nav-item" onclick="location.href='apps.html'">
      <svg class="ic" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/></svg>
      应用开发
    </div>

    <div class="section-label"><span>项目</span></div>

    <div class="project-group">
      <div class="group-head">
        <span class="group-title">
          供应商管理项目
          <svg class="caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
        </span>
        <span class="more">···</span>
      </div>
      <div class="sub-item"><span class="dot blue"></span><span class="txt">采购订单单元数据配置</span></div>
      <div class="sub-item"><span class="dot orange"></span><span class="txt">供应商评级自动化</span></div>
      <div class="sub-item"><span class="dot green"></span><span class="txt">对账单生成逻辑</span></div>
    </div>

    <div class="group-head">
      <span class="group-title">
        财务报表项目
        <svg class="caret rot" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </span>
    </div>
  </div>

  <div class="sb-foot">
    <div class="user">
      <span class="avatar"></span>
      Joe
    </div>
    <div class="foot-right">
      <span class="foot-btn">
        <svg class="ic ic-sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 .8-1 1.7M12 17h.01"/></svg>
        问题反馈
      </span>
    </div>
  </div>
</aside>

<!-- ===================== MAIN ===================== -->
<main class="main">
  <div class="main-center">
    <div class="greeting">
      <img class="mascot" src="../assets/mascot80.png" alt="Lingee">
      早上好，Joe
    </div>

    <div class="composer">
      <div class="composer-input" id="composerInput" contenteditable="true" data-placeholder="布置应用开发任务"></div>
      <div class="composer-bar">
        <button class="round-btn">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        </button>

        <!-- 开发模式 -->
        <div class="dropdown" data-dd="mode">
          <div class="chip" data-chip>
            <span class="chip-label">应用开发</span>
            <svg class="caret-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="menu">
            <div class="menu-item checked" data-val="应用开发"><span class="left">应用开发</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-val="技能开发"><span class="left">技能开发</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-val="智能体开发"><span class="left">智能体开发</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
          </div>
        </div>

        <!-- 基础模型 -->
        <div class="dropdown" data-dd="model">
          <div class="chip" data-chip>
            <span class="chip-label">基础模型</span>
            <svg class="caret-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="menu">
            <div class="menu-item checked" data-val="基础模型"><span class="left">基础模型</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-val="深度思考"><span class="left">深度思考</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-val="快速响应"><span class="left">快速响应</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
          </div>
        </div>

        <!-- Workspace -->
        <div class="dropdown" data-dd="workspace">
          <div class="chip" data-chip>
            <span class="chip-label">Workspace</span>
            <svg class="caret-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="menu">
            <div class="menu-item checked" data-val="Workspace"><span class="left">Workspace</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-val="Personal"><span class="left">Personal</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
          </div>
        </div>

        <!-- 绑定应用 -->
        <div class="dropdown" id="appDropdown" data-dd="app">
          <div class="chip muted" data-chip>
            <span class="app-dot"></span>
            <span class="chip-label">未绑定应用</span>
            <svg class="caret-sm" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
          <div class="menu">
            <div class="menu-item" data-app="Terminal"><span class="left">Terminal</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-app="报价单管理"><span class="left">报价单管理</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-item" data-app="采购订单"><span class="left">采购订单</span><svg class="ic ic-sm menu-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></svg></div>
            <div class="menu-sep"></div>
            <div class="menu-item" data-app="__none"><span class="left"><svg class="ic ic-sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 15l4-4 3 3 4-5 7 7"/></svg>不绑定应用</span></div>
            <div class="menu-item" data-app="__new"><span class="left"><svg class="ic ic-sm" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 9v6M9 12h6"/></svg>新建应用</span></div>
          </div>
        </div>

        <div class="spacer"></div>
        <button class="send-btn" id="sendBtn">
          <svg class="ic" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </div>
  </div>
  <div class="main-foot">内容由 AI 生成，请注意甄别</div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
  var $=function(s,el){return (el||document).querySelector(s)};
  var $$=function(s,el){return [].slice.call((el||document).querySelectorAll(s))};

  /* toast */
  var toastEl=$('#toast'),toastT;
  function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show')},1600)}

  /* dropdowns */
  function closeAll(except){$$('.dropdown.open').forEach(function(d){if(d!==except)d.classList.remove('open')})}
  $$('.dropdown [data-chip]').forEach(function(chip){
    chip.addEventListener('click',function(){var dd=chip.closest('.dropdown');var w=!dd.classList.contains('open');closeAll(dd);dd.classList.toggle('open',w)});
  });
  document.addEventListener('click',function(e){if(!e.target.closest('.dropdown'))closeAll(null)});

  /* generic selectors */
  ['mode','model','workspace'].forEach(function(key){
    var dd=$('.dropdown[data-dd="'+key+'"]');if(!dd)return;
    $$('.menu-item',dd).forEach(function(item){
      item.addEventListener('click',function(e){
        e.stopPropagation();
        $$('.menu-item',dd).forEach(function(i){i.classList.remove('checked')});
        item.classList.add('checked');
        $('.chip-label',dd).textContent=item.getAttribute('data-val');
        dd.classList.remove('open');
        if(key==='mode')applyMode(item.getAttribute('data-val'));
      });
    });
  });

  /* app binding */
  var appDd=$('#appDropdown');
  var appChip=$('[data-chip]',appDd);
  var appLabel=$('.chip-label',appDd);
  function selectApp(name){
    $$('.menu-item',appDd).forEach(function(i){i.classList.remove('checked')});
    if(name){var it=$('.menu-item[data-app="'+name+'"]',appDd);if(it)it.classList.add('checked');appLabel.textContent=name;appChip.classList.remove('muted');appChip.classList.add('selected')}
    else{appLabel.textContent='未绑定应用';appChip.classList.add('muted');appChip.classList.remove('selected')}
  }
  $$('.menu-item',appDd).forEach(function(item){
    item.addEventListener('click',function(e){
      e.stopPropagation();
      var v=item.getAttribute('data-app');
      if(v==='__none'){selectApp(null);toast('已取消绑定应用')}
      else if(v==='__new'){toast('新建应用');location.href='apps.html'}
      else{selectApp(v);toast('已绑定：'+v)}
      appDd.classList.remove('open');
    });
  });

  /* mode ↔ app binding visibility */
  var input=$('#composerInput');
  function applyMode(mode){
    input.setAttribute('data-placeholder','布置'+mode+'任务');
    appDd.classList.toggle('hidden', mode!=='应用开发');
  }

  /* composer send */
  var sendBtn=$('#sendBtn');
  function refreshSend(){sendBtn.classList.toggle('active',input.textContent.trim().length>0)}
  input.addEventListener('input',refreshSend);
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend()}});
  sendBtn.addEventListener('click',doSend);
  function doSend(){var t=input.textContent.trim();if(!t){input.focus();return}toast('已提交：'+t.slice(0,20)+(t.length>20?'…':''));input.innerHTML='';refreshSend()}

  /* project groups collapse */
  $$('.project-group').forEach(function(g){
    var head=$('.group-head',g);if(!head)return;
    head.addEventListener('click',function(){g.classList.toggle('collapsed');var c=$('.caret',head);if(c)c.classList.toggle('rot',g.classList.contains('collapsed'))});
  });
  $$('.sb-scroll > .group-head').forEach(function(h){h.addEventListener('click',function(){var c=$('.caret',h);if(c)c.classList.toggle('rot')})});
  $$('.sb-head-icons .ic').forEach(function(i,idx){i.addEventListener('click',function(){toast(idx===0?'折叠侧栏':'搜索')})});
  var fb=$('.foot-btn');if(fb)fb.addEventListener('click',function(){toast('问题反馈')});
})();
</script>
</body>
</html>
